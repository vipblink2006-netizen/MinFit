                    <button onClick=${() => setError('')} className="text-base font-bold">×</button>
                  </div>
                `}

                <!-- Main Layout 2 Columns -->
                <div className="grid gap-8 lg:grid-cols-[380px_1fr]">
                  <!-- Left Form/Profile Card -->
                  <section className="rounded-3xl border border-plum/10 bg-white p-6 shadow-card lg:p-8">
                    ${activePanel}
                  </section>

                  <!-- Right Results / Workspace Area -->
                  <section className="min-h-[560px] rounded-3xl border border-plum/10 bg-[#F8F5F4] p-6 lg:p-8">
                    ${step === 4 && result ? html`
                      <div>
                        <!-- Top Summary Banner -->
                        <div className="mb-8 rounded-3xl bg-plum p-7 lg:p-8 text-white shadow-xl flex flex-col md:flex-row md:items-end md:justify-between gap-6">
                          <div>
                            <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#F3B6B5]">KẾT QUẢ THẨM ĐỊNH MINFIT</span>
                            <h2 className="mt-2 text-3xl lg:text-4xl font-black">Các phương án đề xuất cho ${form.client_name || 'Khách hàng'}.</h2>
                            <p className="mt-2 text-xs lg:text-sm text-white/70">
                              Đã áp dụng mặt bằng giá giao dịch chuẩn xác T8/2026 tại Hà Nội.
                            </p>
                          </div>

                          <!-- View Mode Switcher -->
                          <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                            <div className="flex items-center rounded-full bg-white/15 p-1 border border-white/20">
                              <button
                                onClick=${() => setViewMode('client')}
                                className=${`rounded-full px-4 py-2 text-xs font-bold transition flex items-center gap-1.5 ${viewMode === 'client' ? 'bg-white text-plum shadow-md' : 'text-white/80 hover:text-white'}`}
                              >
                                <${UserCheck} size=${14} /> Bản Khách hàng
                              </button>
                              <button
                                onClick=${() => setViewMode('broker')}
                                className=${`rounded-full px-4 py-2 text-xs font-bold transition flex items-center gap-1.5 ${viewMode === 'broker' ? 'bg-white text-plum shadow-md' : 'text-white/80 hover:text-white'}`}
                              >
                                <${Briefcase} size=${14} /> Bản Chuyên gia
                              </button>
                            </div>

                            <button
                              onClick=${() => { setResult(null); setStep(3); }}
                              className="rounded-full border border-white/30 bg-white/10 px-4 py-2.5 text-xs font-bold text-white transition hover:bg-white hover:text-plum"
                            >
                              Đổi kịch bản
                            </button>
                          </div>
                        </div>

                        <!-- Top Comparison Matrix (Side-by-side) if >= 2 projects -->
                        <${WorkflowComparison}
                          result=${result}
                          form=${form}
                          onDetail=${setDetail}
                          onPrint=${handlePrintComparison}
                        />

                        <!-- List of Project Result Cards -->
                        <div>
                          <div className="mb-5 flex items-center justify-between">
                            <h3 className="text-xl font-black text-plum">Chi tiết từng phương án đề xuất</h3>
                            <span className="text-xs font-semibold text-ink/45">${result.project_count} phương án trong danh mục</span>
                          </div>

                          ${result.results.map((item, idx) => html`
                            <${WorkflowResultCard}
                              key=${item.project.id}
                              item=${item}
                              rank=${idx + 1}
                              form=${form}
                              viewMode=${viewMode}
                              onDetail=${setDetail}
                              onPrint=${handlePrintDetail}
                            />
                          `)}
                        </div>
                      </div>
                    ` : html`
                      <div className="grid h-full min-h-[500px] place-items-center text-center p-6">
                        <div>
                          <div className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-plum text-3xl font-black text-white shadow-xl">
                            ${step}
                          </div>
                          <h2 className="mt-6 text-3xl font-black text-plum">
                            ${step === 1 ? 'Điền thông tin khách hàng & nơi làm việc' : step === 2 ? 'Khai báo tài chính & Ước tính sinh hoạt' : 'Chọn các dự án Hà Nội để so sánh và chạy phân tích'}
                          </h2>
                          <p className="mx-auto mt-3 max-w-md text-sm text-ink/50 leading-relaxed">
                            MinFit sẽ tự động bóc tách 3 con số quan trọng nhất và đưa ra bản tham vấn khách hàng 1 phút hiểu ngay.
                          </p>
                        </div>
                      </div>
                    `}
                  </section>
                </div>

                <!-- Navigation Bottom Buttons -->
                <div className="mt-8 flex flex-wrap items-center justify-between gap-4">
                  <button
                    onClick=${() => setStep(s => Math.max(1, s - 1))}
                    disabled=${step === 1}
                    className="rounded-full border border-plum/20 bg-white px-7 py-3.5 text-sm font-bold text-plum transition hover:bg-plum/5 disabled:opacity-30 disabled:pointer-events-none"
                  >
                    ← Quay lại
                  </button>

                  <div className="flex items-center gap-3">
                    ${step < 3 && html`
                      <button
                        onClick=${() => setStep(step + 1)}
                        className="rounded-full bg-brick px-8 py-3.5 text-sm font-bold text-white shadow-lg transition hover:bg-plum hover:scale-105"
                      >
                        Tiếp tục →
                      </button>
                    `}

                    ${step === 3 && html`
                      <button
                        disabled=${!selected.length || loading}
                        onClick=${runAnalysis}
                        className="rounded-full bg-brick px-9 py-4 text-sm font-extrabold text-white shadow-xl transition hover:bg-plum hover:scale-105 disabled:opacity-50 disabled:pointer-events-none flex items-center gap-2.5"
                      >
                        ${loading ? 'Đang phân tích dòng tiền...' : 'Chạy phân tích rổ dự án →'}
                      </button>
                    `}

                    ${step === 4 && result && html`
                      <button
                        onClick=${saveClientProfile}
                        className="rounded-full bg-plum px-8 py-3.5 text-sm font-bold text-white shadow-md transition hover:bg-brick flex items-center gap-2"
                      >
                        <${Save} size=${15} /> ${saved ? '✓ Đã lưu hồ sơ' : 'Lưu hồ sơ khách hàng'}
                      </button>
                    `}
                  </div>
                </div>
              </div>
            </main>

            <!-- DETAIL MODAL -->
            ${detail && html`
              <${WorkflowDetail}
                item=${detail}
                form=${form}
                onClose=${() => setDetail(null)}
                onPrint=${handlePrintDetail}
              />
            `}

            <!-- TOAST NOTIFICATION -->
            ${toastMsg && html`
              <div className="fixed bottom-6 right-6 z-[90] rounded-2xl bg-plum px-6 py-4 text-sm font-bold text-white shadow-2xl flex items-center gap-3 animate-bounce">
                <span>${toastMsg}</span>
              </div>
            `}

            <!-- PRINTABLE CONTAINERS (Hidden on screen, visible on print) -->
            ${printType === 'detail' && printItem && html`
              <${PrintDetailView} item=${printItem} form=${form} />
            `}
            ${printType === 'comparison' && result && html`
              <${PrintComparisonView} result=${result} form=${form} />
            `}
          </div>
        `;
      }

      function ClientsPage() {
        const [clients, setClients] = useState([]);
        useEffect(() => {
          fetch('/api/clients')
            .then(res => res.json())
            .then(data => setClients(data.clients || []))
            .catch(() => {});
        }, []);

        return html`<main className="screen-only min-h-screen bg-shell px-5 py-14 lg:px-10 lg:py-20">
          <div className="mx-auto max-w-[1440px]">
            <p className="text-xs font-extrabold uppercase tracking-wide text-brick">CLIENT CRM</p>
            <div className="mt-3 flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
              <div>
                <h1 className="text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Khách hàng của tôi.</h1>
                <p className="mt-4 text-lg leading-relaxed text-ink/55">Mở lại hồ sơ và tiếp tục các phiên thẩm định đang thực hiện.</p>
              </div>
              <${Link} to="/dashboard" className="w-fit rounded-full bg-brick px-6 py-4 text-sm font-bold text-white transition hover:bg-plum">+ Tạo hồ sơ mới</${Link}>
            </div>
            <div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-4">
              ${[
                { id:'cl-01', name:'Anh Tuấn & Chị Mai', budget:'5,0 – 5,5 tỷ', area:'Cầu Giấy / Nam Từ Liêm', status:'Khuyến nghị mua', tone:'bg-[#DDEDE1] text-[#276342]', initials:'TM' },
                { id:'cl-02', name:'Chị Thanh Hương', budget:'7,0 – 8,0 tỷ', area:'Cầu Giấy / Tây Hồ', status:'Cần điều chỉnh vay', tone:'bg-[#F6EECB] text-[#806B1F]', initials:'TH' },
                { id:'cl-03', name:'Anh Hoàng Long', budget:'3,5 – 4,0 tỷ', area:'Hà Đông / Gia Lâm', status:'Khuyến nghị mua', tone:'bg-[#DDEDE1] text-[#276342]', initials:'HL' },
                { id:'cl-04', name:'Vợ chồng Trọng Đạt', budget:'9,5 – 10,5 tỷ', area:'Nam Từ Liêm (Matrix One)', status:'Chưa nên mua', tone:'bg-[#FCE8E5] text-[#9C3E40]', initials:'TD' },
              ].map((c, index) => html`<article key=${c.id} className="rounded-2xl border border-plum/10 bg-white p-6 shadow-lg transition hover:-translate-y-1">
                <div className="flex items-start justify-between">
                  <span className="grid h-12 w-12 place-items-center rounded-xl bg-plum text-sm font-bold text-white">${c.initials}</span>
                  <span className=${`rounded-full px-3 py-2 text-xs font-bold ${c.tone}`}>${c.status}</span>
                </div>
                <p className="mt-8 text-xs font-extrabold tracking-wide text-ink/35">KHÁCH HÀNG ${String(index + 1).padStart(2, '0')}</p>
                <h2 className="mt-2 text-xl font-bold leading-tight tracking-tight text-plum">${c.name}</h2>
                <div className="my-6 grid grid-cols-2 border-y border-plum/10 py-4">
                  <div><small className="text-xs font-bold text-ink/35">NGÂN SÁCH</small><strong className="mt-2 block text-base text-ink">${c.budget}</strong></div>
                  <div className="border-l border-plum/10 pl-4"><small className="text-xs font-bold text-ink/35">KHU VỰC</small><strong className="mt-2 block text-base text-ink">${c.area}</strong></div>
                </div>
                <${Link} to="/dashboard" className="flex items-center justify-between rounded-xl bg-[#F4F0EF] px-4 py-3.5 text-sm font-bold text-plum transition hover:bg-plum hover:text-white">
                  Xem phân tích <${Arrow} />
                </${Link}>
              </article>`)}
            </div>
          </div>
        </main>`;
      }

      function App() {
        const [role, setRole] = useState('broker');
        const logout = () => {
          setRole(null);
        };
        const loggedBroker = role === 'broker';

        return html`<div className="min-h-screen">
          <${Navbar} role=${role} onLogout=${logout} />
          <${Routes}>
            <${Route} path="/" element=${html`<${HomePage} />`} />
            <${Route} path="/dashboard" element=${html`<${WorkflowDashboard} />`} />
            <${Route} path="/workflow" element=${html`<${WorkflowDashboard} />`} />
            <${Route} path="/clients" element=${html`<${ClientsPage} />`} />
            <${Route} path="*" element=${html`<${Navigate} to="/dashboard" replace />`} />
          </${Routes}>
          <${Footer} />
        </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
    </script>
  </body>
</html>
