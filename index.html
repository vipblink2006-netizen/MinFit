      const PROJECTS = [
        { id:'lotus', name:'Lotus Garden Tân Phú', area:'Tân Phú', price:3.9, rooms:'2PN · 70 m²', distance:9.2, fit:88, amenities:['Trường học','Công viên','Chỗ đỗ xe'] },
        { id:'cedar', name:'Cedar Park Bình Thạnh', area:'Bình Thạnh', price:6.1, rooms:'2PN · 76 m²', distance:3.4, fit:92, amenities:['Công viên','Hồ bơi','Chỗ đỗ xe'] },
        { id:'greenloop', name:'Green Loop Thủ Đức', area:'Thủ Đức', price:3.7, rooms:'2PN · 68 m²', distance:12.8, fit:84, amenities:['Công viên','Yên tĩnh','Chỗ đỗ xe'] },
        { id:'aqua', name:'Aqua Vista Quận 7', area:'Quận 7', price:5.8, rooms:'3PN · 88 m²', distance:10.6, fit:86, amenities:['Trường học','Hồ bơi','Công viên'] },

        { id:'02', name:'Chị Phương Anh', initials:'PA', budget:'6,5 tỷ', area:'Bình Thạnh', status:'Đã phân tích', tone:'bg-[#F6EECB] text-[#806B1F]' },

        { id:'br-02', name:'Trần Phương Linh', email:'linh.tran@minfit.vn', joined:'18/03/2026', files:16, status:'Active' },

          <section id="pricing" className="bg-white px-6 py-24 lg:px-10"><div className="mx-auto flex max-w-[1440px] flex-col items-start justify-between gap-8 rounded-[34px] bg-brick p-10 text-white md:flex-row md:items-center lg:p-16"><div><p className="text-xs font-bold uppercase tracking-wide text-white/60">BẮT ĐẦU MIỄN PHÍ</p><h2 className="mt-4 max-w-3xl text-3xl font-extrabold leading-tight tracking-tight lg:text-5xl">Một workspace rõ ràng cho mọi cuộc tư vấn.</h2><p className="mt-5 text-base leading-relaxed text-white/70">Tạo tài khoản môi giới và bắt đầu kiểm tra phương án đầu tiên trong vài phút.</p></div><${Link} to="/auth/register" className="flex shrink-0 items-center gap-6 rounded-full bg-white px-7 py-4 text-base font-bold tracking-normal text-plum transition hover:scale-105">Đăng ký miễn phí <${Arrow} /></${Link}></div></section></main>`;

      function LegacyFeature({ number,title,text,color }) { return html`<article className="min-h-[300px] rounded-2xl border border-plum/10 bg-white p-8 shadow-lg transition duration-300 hover:-translate-y-1"><div className="flex items-start justify-between"><span className="text-xs font-bold tracking-wide text-plum/35">${number}</span><span className=${`h-3 w-3 rounded-full ${color}`}></span></div><div className="mt-20"><h3 className="text-2xl font-bold leading-tight tracking-tight text-plum">${title}</h3><p className="mt-5 text-base leading-relaxed tracking-normal text-[#736266]">${text}</p></div></article>`; }

      function DashboardMockup() {

              <div className="flex h-12 items-center justify-between border-b border-plum/10 bg-[#FAF8F8] px-5"><div className="flex gap-2"><i className="h-2.5 w-2.5 rounded-full bg-[#FC8F8F]"></i><i className="h-2.5 w-2.5 rounded-full bg-[#D9A25D]"></i><i className="h-2.5 w-2.5 rounded-full bg-[#6D9C7C]"></i></div><span className="text-[10px] font-bold tracking-widest text-plum/35">MINFIT / ANALYSIS</span><span className="h-6 w-6 rounded-full bg-plum/10"></span></div>

                <div className="p-5"><div className="flex items-start justify-between"><div><span className="block h-2 w-20 rounded-full bg-brick/50"></span><span className="mt-3 block h-5 w-44 rounded-full bg-plum"></span></div><strong className="text-4xl font-extrabold tracking-tight text-plum">88</strong></div><div className="mt-7 grid grid-cols-3 gap-3">${['DTI 34,8%','FCF 18,5tr','PMT 31,1tr'].map((v)=>html`<div key=${v} className="rounded-xl bg-[#F4F0EF] p-3"><span className="text-[9px] font-bold text-plum/45">${v}</span><span className="mt-2 block h-1.5 w-10 rounded-full bg-brick/40"></span></div>`)}</div><div className="mt-5 rounded-2xl border border-plum/10 p-4"><div className="flex items-center justify-between"><span className="text-[10px] font-bold tracking-wide text-plum/40">DÒNG TIỀN 240 THÁNG</span><span className="text-[9px] text-[#4E8B67]">● AN TOÀN</span></div><svg viewBox="0 0 440 150" className="mt-3 w-full"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B44446" stop-opacity=".28"/><stop offset="1" stop-color="#B44446" stop-opacity="0"/></linearGradient></defs><path d="M0 112 C42 105 66 92 101 96 C138 100 158 59 204 68 C250 77 272 48 316 55 C355 62 386 30 440 34 L440 150 L0 150Z" fill="url(#area)"/><path d="M0 112 C42 105 66 92 101 96 C138 100 158 59 204 68 C250 77 272 48 316 55 C355 62 386 30 440 34" fill="none" stroke="#B44446" stroke-width="4" stroke-linecap="round"/></svg></div></div>
              </div>
            </div>
          </div>
        </${MotionDiv}>`;
      }

      function HomePage() {
        return html`<main id="top" className="overflow-hidden bg-[#F8F6F6]">
          <section className="relative min-h-[850px] overflow-hidden bg-plum text-white">

      function compute(form) { return PROJECTS.map(p=>{ const principal=p.price*1000*(form.ltv/100), r=form.rate/1200, n=form.years*12; const pmt=r===0?principal/n:principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1); const stress=pmt*(1+Math.max(form.floatRate-form.rate,0)/Math.max(form.rate,1)*.52); const dti=(stress+form.debt)/Math.max(form.income,1)*100; const fcf=form.income-stress-form.debt-form.expenses-1.2; const reserve=form.cash*1000-p.price*1000*(1-form.ltv/100); const survival=reserve>0?reserve/Math.max(stress+form.debt+form.expenses,1):0; const fit=Math.round(clamp(p.fit*.55+clamp(100-Math.max(dti-30,0)*2.2-Math.max(-fcf,0)*3,20,100)*.45,0,99)); return {...p,payment:stress,dti,fcf,survival,fit}; }).sort((a,b)=>b.fit-a.fit).slice(0,3); }

-extrabold uppercase tracking-wide text-[#F3B6B5]">KẾT QUẢ THẨM ĐỊNH</p><div className="mt-3 flex flex-col justify-between gap-6 md:flex-row md:items-end"><div><h2 className="text-3xl font-extrabold leading-tight tracking-tight lg:text-5xl">Top 3 phương án vừa sức nhất.</h2><p className="mt-4 text-base leading-relaxed tracking-normal text-white/65">${submitted.persona} · LTV ${submitted.ltv}% · Lãi suất ${submitted.rate}% → ${submitted.floatRate}% · ${submitted.years} năm.</p></div><div className="flex items-end gap-2"><strong className="text-6xl font-extrabold leading-none tracking-tight">${results[0].fit}</strong><span className="mb-2 text-xs font-bold tracking-wide text-white/50">FIT SCORE CAO NHẤT</span></div></div></div><div className="space-y-5">${results.map((item,index)=>html`<${ResultCard} key=${item.id} item=${item} rank=${index+1} />`)}</div><div className="mt-5 rounded-2xl border border-brick/20 bg-[#F7E9E7] p-6"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">LƯU Ý TƯ VẤN</p><p className="mt-3 text-base leading-relaxed tracking-normal text-[#6F5357]">Kết quả mô phỏng theo dữ liệu đầu vào. Trước khi đặt cọc, cần xác minh pháp lý, bảng giá thực tế và lãi suất ngân hàng.</p></div></section></div></div></main>`;
      }

      function ClientsPage() { return html`<main className="min-h-screen bg-shell px-5 py-14 lg:px-10 lg:py-20"><div className="mx-auto max-w-[1440px]"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">CLIENT CRM</p><div className="mt-3 flex flex-col gap-6 md:flex-row md:items-end md:justify-between"><div><h1 className="text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Khách hàng của tôi.</h1><p className="mt-4 text-lg leading-relaxed text-ink/55">Mở lại hồ sơ và tiếp tục các phiên phân tích đang thực hiện.</p></div><${Link} to="/analysis/new" className="w-fit rounded-full bg-brick px-6 py-4 text-sm font-bold text-white transition hover:bg-plum">+ Tạo hồ sơ mới</${Link}></div><div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-4">${CLIENTS.map((c,index)=>html`<article key=${c.id} className="rounded-2xl border border-plum/10 bg-white p-6 shadow-lg transition hover:-translate-y-1"><div className="flex items-start justify-between"><span className="grid h-12 w-12 place-items-center rounded-xl bg-plum text-sm font-bold text-white">${c.initials}</span><span className=${`rounded-full px-3 py-2 text-xs font-bold tracking-normal ${c.tone}`}>${c.status}</span></div><p className="mt-8 text-xs font-extrabold tracking-wide text-ink/35">KHÁCH HÀNG ${String(index+1).padStart(2,'0')}</p><h2 className="mt-2 text-xl font-bold leading-tight tracking-tight text-plum">${c.name}</h2><div className="my-6 grid grid-cols-2 border-y border-plum/10 py-4"><div><small className="text-xs font-bold tracking-wide text-ink/35">NGÂN SÁCH</small><strong className="mt-2 block text-base tracking-normal text-ink">${c.budget}</strong></div><div className="border-l border-plum/10 pl-4"><small className="text-xs font-bold tracking-wide text-ink/35">KHU VỰC</small><strong className="mt-2 block text-base tracking-normal text-ink">${c.area}</strong></div></div><${Link} to=${`/analysis/${c.id}`} className="flex items-center justify-between rounded-xl bg       function ProjectsPage() { return html`<main className="min-h-screen bg-[#F7F3F2] px-5 py-14 lg:px-10 lg:py-20"><div className="mx-auto max-w-[1440px]"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">PROJECT VAULT</p><h1 className="mt-3 text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Kho dự án.</h1><p className="mt-4 max-w-2xl text-lg leading-relaxed text-ink/55">Kho dữ liệu chuẩn hóa để môi giới có thể tư vấn bằng cùng một ngôn ngữ tài chính.</p><div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-3">${PROJECTS.map((p,i)=>html`<article key=${p.id} className="overflow-hidden rounded-2xl border border-plum/10 bg-white shadow-lg"><div className=${`noise flex h-40 items-end justify-between p-6 text-white ${i%3===0?'bg-plum':i%3===1?'bg-brick':'bg-[#85505A]'}`}><span className="text-xs font-bold tracking-wide text-white/65">PROJECT / ${String(i+1).padStart(2,'0')}</span><strong className="text-4xl font-extrabold tracking-tight">${p.fit}</strong></div><div className="p-6"><p className="text-sm font-bold tracking-normal text-brick">${p.area}</p><h2 className="mt-2 text-2xl font-bold leading-tight tracking-tight text-plum">${p.name}</h2><p className="mt-2 text-base leading-relaxed text-ink/50">${p.rooms} · ${p.distance} km</p><div className="mt-5 flex flex-wrap gap-2">${p.amenities.map(a=>html`<span className="rounded-full bg-[#F3EFEF] px-3 py-2 text-xs font-semibold tracking-normal text-plum">${a}</span>`)}</div><div className="mt-6 flex items-center justify-between border-t border-plum/10 pt-5"><span className="text-sm text-ink/45">Giá tham chiếu</span><b className="text-xl text-plum">${String(p.price).replace('.',',')} tỷ</b></div></div></article>`)}</div></div></main>`; }

      function App() { const [role,setRole]=useState(()=>localStorage.getItem('minfit-role')||null); const logout=()=>{localStorage.removeItem('minfit-role');setRole(null);}; const loggedBroker=role==='broker'; const loggedAdmin=role==='admin'; return html`<div className="min-h-screen"><${Navbar} role=${role} onLogout=${logout} /><${Routes}><${Route} path="/" element=${html`<${HomePage} />`} /><${Route} path="/auth/login" element=${html`<${AuthPage} onLogin=${setRole} />`} /><${Route} path="/auth/register" element=${html`<${AuthPage} mode="register" onLogin=${setRole} />`} /><${Route} path="/admin" element=${loggedAdmin?html`<${AdminPage} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/dashboard" element=${loggedBroker?html`<${WorkflowDashboard} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/clients" element=${loggedBroker?html`<${ClientsPage} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/projects" element=${html`<${ProjectsPage} />`} /><${Route} path="/analysis/:clientId" element=${loggedBroker?html`<${WorkflowDashboard} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="*" element=${html`<${Navigate} to="/" replace />`} /></${Routes}><${Footer} /></div>`; }
      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
