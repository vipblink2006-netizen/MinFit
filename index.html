      /* ================= FORMATTERS & HELPERS ================= */
      const formatVND = (v) => `${Number(v || 0).toLocaleString('vi-VN')} VND`;
      const formatMillion = (v) => `${(Number(v || 0) / 1000000).toLocaleString('vi-VN', { maximumFractionDigits: 1 })} triệu/tháng`;
      const formatBillion = (v) => `${(Number(v || 0) / 1000000000).toLocaleString('vi-VN', { maximumFractionDigits: 2 }).replace('.', ',')} tỷ VND`;
      const money = (v) => `${Number(v || 0).toFixed(1).replace('.', ',')} triệu/tháng`;
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      function getProjectAssessmentInfo(item, form) {
        const dti = Number(item.financial?.max_dti || 0) * 100;
        const fcf = Number(item.financial?.min_fcf || 0);
        const distance = Number(item.distance_km || 0);
        const shockRatio = Number(item.payment_shock?.ratio || 0);
        const stressRisk = item.stress_test?.risk;
        const rejections = item.rejection_reasons || [];

        // 1. Status classification
        let status = 'An toàn';
        let statusClass = 'bg-[#DDEDE1] text-[#276342] border border-[#276342]/20';
        let statusBadge = 'bg-[#DDEDE1] text-[#276342]';
        if (rejections.length > 0 || stressRisk || dti > 50 || fcf < 0) {
          status = 'Không nên';
          statusClass = 'bg-[#FCE8E5] text-[#9C3E40] border border-[#9C3E40]/20';
          statusBadge = 'bg-[#FCE8E5] text-[#9C3E40]';
        } else if (dti > 40 || fcf < 10000000 || shockRatio > 2.0) {
          status = 'Cân nhắc';
          statusClass = 'bg-[#F6EECB] text-[#806B1F] border border-[#806B1F]/20';
          statusBadge = 'bg-[#F6EECB] text-[#806B1F]';
        }

        // 2. FCF dynamic remark
        let fcfRemark = '** Dư dả sau khi trừ sinh hoạt.';
        if (fcf < 0) {
          fcfRemark = '** Cảnh báo thâm hụt dòng tiền sau sinh hoạt.';
        } else if (fcf < 10000000) {
          fcfRemark = '** Áp lực chi tiêu, cần quản lý ngân sách chặt chẽ.';
        } else if (fcf < 20000000) {
          fcfRemark = '** Đủ đệm an toàn sau chi phí sinh hoạt.';
        }

        // 3. Distance comment
        let distanceComment = 'Rất phù hợp';
        if (distance === 0) distanceComment = 'Rất phù hợp';
        else if (distance <= 3) distanceComment = 'Rất gần nơi làm việc';
        else if (distance <= 7) distanceComment = 'Rất phù hợp';
        else if (distance <= 12) distanceComment = 'Thuận tiện di chuyển';
        else distanceComment = 'Hơi xa nơi làm việc';

        // 4. Amenities matched
        const projectAmenities = item.project?.amenities || [];
        const requiredAmenities = form.required_amenities || ['school', 'park', 'parking'];
        const matchedAmenities = item.matched_amenities || projectAmenities.filter(a => requiredAmenities.includes(a));
        const matchedCount = matchedAmenities.length;
        const totalRequired = requiredAmenities.length;
        const matchedNames = matchedAmenities.map(k => AMENITY_LABELS[k] || k).join(', ');

        // 5. Pros & Cons (Điểm cộng & Lưu ý)
        const pros = [
          `Khoảng cách: ${distance.toFixed(1)} km (${distanceComment}).`,
          `Khớp ${matchedCount}/${totalRequired} tiện ích ưu tiên${matchedNames ? ` (${matchedNames})` : ''}.`
        ];
        if (Number(item.financial?.survival_months || 0) >= 6) {
          pros.push(`Quỹ dự phòng tốt (${Number(item.financial.survival_months).toFixed(1)} tháng sinh tồn).`);
        }
        if (dti <= 35) {
          pros.push(`Tỷ lệ nợ DTI ở vùng an toàn (${dti.toFixed(1)}% thu nhập).`);
        }

        const cons = [];
        if (dti > 45) {
          cons.push(`Trả góp chiếm gần 50% thu nhập (${dti.toFixed(1)}%), cần ổn định công việc.`);
        } else if (dti > 35) {
          cons.push(`Trả góp chiếm ${dti.toFixed(1)}% thu nhập, cần duy trì nguồn thu nhập ổn định.`);
        }
        if (shockRatio > 1.8) {
          cons.push(`Payment Shock tăng ${shockRatio.toFixed(1)}x khi chuyển sang lãi thả nổi.`);
        }
        if (fcf < 10000000 && fcf >= 0) {
          cons.push(`Tiền dư FCF hàng tháng khiêm tốn, hạn chế chi phí phát sinh.`);
        }
        if (fcf < 0) {
          cons.push(`Dòng tiền tự do FCF âm trong giai đoạn lãi thả nổi.`);
        }
        if (stressRisk) {
          cons.push(`Kịch bản lãi suất áp lực (${form.stress_rate_percent}%) tiềm ẩn rủi ro trả nợ.`);
        }
        if (rejections.length > 0) {
          rejections.forEach(r => cons.push(r));
        }
        if (cons.length === 0) {
          cons.push(`Cần lưu ý theo dõi biến động lãi suất sau giai đoạn ưu đãi.`);
        }

        return {
          status,
          statusClass,
          statusBadge,
          fcfRemark,
          distanceComment,
          matchedCount,
          totalRequired,
          matchedNames,
          pros,
          cons,
          dti,
          fcf,
          distance,
        };
      }

            })
            .catch(() => setError('Không tải được danh sách dự án từ máy chủ.'));
        }, []);

        const update = (key) => (e) => {
          setForm(old => ({
            ...old,
            [key]: e.target.type === 'number' ? Number(e.target.value) : e.target.value
          }));
        };

        const updateAddressCity = (e) => {
          const city = e.target.value;
          const dists = DISTRICTS_BY_PROVINCE[city] || ['Trung tâm'];
          const defaultDist = dists[0];
          const defaultWard = (WARDS_BY_DISTRICT[defaultDist] || ['Phường 1'])[0];
          setForm(old => ({
            ...old,
            address_city: city,
            address_district: defaultDist,
            address_ward: defaultWard
          }));
        };

        const updateAddressDistrict = (e) => {
          const dist = e.target.value;
          const defaultWard = (WARDS_BY_DISTRICT[dist] || ['Phường 1'])[0];
          setForm(old => ({
            ...old,
            address_district: dist,
            address_ward: defaultWard
          }));
        };

        const updateWorkplaceCity = (e) => {
          const city = e.target.value;
          const dists = DISTRICTS_BY_PROVINCE[city] || ['Trung tâm'];
          const defaultDist = dists[0];
          const defaultWard = (WARDS_BY_DISTRICT[defaultDist] || ['Phường 1'])[0];
          const coords = DISTRICT_COORDINATES[defaultDist] || [10.7769, 106.7009];
          setForm(old => ({
            ...old,
            workplace_city: city,
            workplace_district: defaultDist,
            workplace_ward: defaultWard,
            workplace_lat: coords[0],
            workplace_lng: coords[1]
          }));
        };

        const updateWorkplaceDistrict = (e) => {

            <div className="mt-6 rounded-2xl bg-[#F8F5F4] p-4 text-xs border border-plum/10">
              <p className="font-extrabold uppercase tracking-wider text-brick">Kịch bản vay</p>
              <p className="mt-2 leading-relaxed text-ink/65 font-medium">
                Vay <b>${form.ltv_percent}%</b> trong <b>${form.term_years} năm</b> · Ưu đãi <b>${form.intro_rate_percent}%</b> (${form.intro_months} thg) · Thả nổi <b>${form.floating_rate_percent}%</b> · Stress <b>${form.stress_rate_percent}%</b>.
              </p>
            </div>

            <div className="mt-6 space-y-3">
              <button
                onClick=${saveClientProfile}
                className="w-full rounded-full bg-plum px-5 py-3 text-xs font-bold text-white shadow-md transition hover:bg-brick flex items-center justify-center gap-2"
              >
                <${Save} size=${14} /> ${saved ? '✓ Đã lưu hồ sơ' : 'Lưu hồ sơ khách hàng'}
              </button>

              ${result && result.results.length >= 2 && html`
                <button
                  onClick=${handlePrintComparison}
                  className="w-full rounded-full border border-plum/20 bg-white px-5 py-3 text-xs font-bold text-plum transition hover:bg-plum/5 flex items-center justify-center gap-2"
                >
                  <${Printer} size=${14} /> In bảng so sánh
                </button>
              `}
            </div>
          </div>
        `;

        const activePanel = step === 1 ? stepOne : step === 2 ? stepTwo : step === 3 ? stepThree : clientSummarySidebar;

        return html`
          <div>
            <!-- MAIN SCREEN CONTENT -->
            <main className="screen-only min-h-screen bg-shell px-4 py-8 lg:px-10 lg:py-12">
              <div className="mx-auto max-w-[1440px]">
                <!-- Header & Breadcrumb -->
                <div className="mb-6 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                  <div>
                    <p className="text-xs font-extrabold uppercase tracking-widest text-brick">MINFIT / CLIENT WORKFLOW</p>
                    <h1 className="mt-2 text-3xl lg:text-5xl font-black tracking-tight text-plum">
                      Thẩm định một quyết định mua nhà.
                    </h1>
                    <p className="mt-2 max-w-3xl text-sm lg:text-base text-ink/60">
                      Từ bức tranh thu nhập, nơi làm việc đến dòng tiền từng tháng sau ưu đãi và kịch bản lãi suất thả nổi.
                    </p>
                  </div>
                  <div className="rounded-2xl border border-plum/10 bg-white px-5 py-3.5 text-xs font-bold text-plum shadow-sm">
                    Bước ${step} / 4
                  </div>
                </div>

                <!-- 4 Step Tabs -->
                <div className="mb-8 grid grid-cols-2 md:grid-cols-4 gap-2">
                  ${[
                    'Thông tin khách hàng',
                    'Sức khỏe tài chính',
                    'Danh mục đề xuất & Vay',
                    'Kết quả & So sánh'
                  ].map((label, index) => html`
                    <button
                      key=${label}
                      onClick=${() => (step >= index + 1 || result) && setStep(index + 1)}
                      className=${`border-b-2 px-3 py-3.5 text-left text-xs font-black uppercase tracking-wider transition ${step === index + 1 ? 'border-brick text-brick bg-white/40' : 'border-plum/10 text-ink/40 hover:text-plum'}`}
                    >
                      <span className="mr-1.5 opacity-60">0${index + 1} ·</span> ${label}
                    </button>
                  `)}
                </div>

                ${error && html`
                  <div className="mb-6 rounded-2xl border border-[#E7B5A7] bg-[#FFF4F0] p-4 text-sm font-bold text-[#9C3E40] flex items-center justify-between">
                    <span>${error}</span>
                    <button onClick=${() => setError('')} className="text-base font-bold">×</button>
                  </div>
                `}

                <!-- Main Layout 2 Columns -->
                <div className="grid gap-8 lg:grid-cols-[380px_1fr]">
                  <!-- Left Form/Profile Card -->
                  <section className="rounded-3xl border border-plum/10 bg-white p-6 shadow-card lg:p-8">
                    ${activePanel}
                  </section>

                  <!-- Right Results / Workspace Area -->
                  <section className="min-h-[560px] rounded-3xl border border-plum/10 bg-[#F8F5F4] p-6 lg:p-8">
                    ${step === 4 && result ? html`
                      <div>
                        <!-- Top Summary Banner -->
                        <div className="mb-8 rounded-3xl bg-plum p-7 lg:p-8 text-white shadow-xl flex flex-col md:flex-row md:items-end md:justify-between gap-6">
                          <div>
                            <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#F3B6B5]">KẾT QUẢ THẨM ĐỊNH MINFIT</span>
                            <h2 className="mt-2 text-3xl lg:text-4xl font-black">Các phương án đề xuất cho ${form.client_name || 'Khách hàng'}.</h2>
                            <p className="mt-2 text-xs lg:text-sm text-white/70">
                              Đã stress-test với kịch bản lãi suất thả nổi <b>${form.floating_rate_percent}%/năm</b> và áp lực <b>${form.stress_rate_percent}%/năm</b>.
                            </p>
                          </div>
                          <div className="flex flex-wrap items-center gap-3">
                            <button
                              onClick=${saveClientProfile}
                              className="rounded-full bg-brick px-5 py-3 text-xs font-bold text-white shadow-lg transition hover:bg-white hover:text-plum flex items-center gap-2"
                            >
                              <${Save} size=${14} /> ${saved ? '✓ Đã lưu hồ sơ' : 'Lưu hồ sơ khách hàng'}
                            </button>
                            <button
                              onClick=${() => { setResult(null); setStep(3); }}
                              className="rounded-full border border-white/30 bg-white/10 px-5 py-3 text-xs font-bold text-white transition hover:bg-white hover:text-plum"
                            >
                              Điều chỉnh kịch bản
                            </button>
                          </div>
                        </div>

                        <!-- Top Comparison Matrix (Side-by-side) if >= 2 projects -->
                        <${WorkflowComparison}
                          result=${result}
                          form=${form}
                          onDetail=${setDetail}
                          onPrint=${handlePrintComparison}
                        />

                        <!-- List of Project Result Cards -->
                        <div>
                          <div className="mb-5 flex items-center justify-between">
                            <h3 className="text-xl font-black text-plum">Chi tiết từng phương án đề xuất</h3>
                            <span className="text-xs font-semibold text-ink/45">${result.project_count} phương án trong danh mục</span>
                          </div>

                          ${result.results.map((item, idx) => html`
                            <${WorkflowResultCard}
                              key=${item.project.id}
                              item=${item}
                              rank=${idx + 1}
                              form=${form}
                              onDetail=${setDetail}
                            />
                          `)}
                        </div>
                      </div>
                    ` : html`
                      <div className="grid h-full min-h-[500px] place-items-center text-center p-6">
                        <div>
                          <div className="mx-auto grid h-20 w-20 place-items-center rounded-full bg-plum text-3xl font-black text-white shadow-xl">
                            ${step}
                          </div>
                          <h2 className="mt-6 text-3xl font-black text-plum">
                            ${step === 1 ? 'Điền thông tin khách hàng & nơi làm việc' : step === 2 ? 'Khai báo các chỉ số tài chính (VND)' : 'Chọn các dự án để so sánh và chạy phân tích'}
                          </h2>
                          <p className="mx-auto mt-3 max-w-md text-sm text-ink/50 leading-relaxed">
                            MinFit sẽ mô phỏng chi tiết từng tháng dòng tiền, áp lực trả nợ DTI, khoảng đệm an toàn FCF và tính toán khoảng cách di chuyển thực tế.
                          </p>
                        </div>
                      </div>
                    `}
                  </section>
                </div>

                <!-- Navigation Bottom Buttons -->
                <div className="mt-8 flex flex-wrap items-center justify-between gap-4">
                  <button
                    onClick=${() => setStep(s => Math.max(1, s - 1))}
                    disabled=${step === 1}
                    className="rounded-full border border-plum/20 bg-white px-7 py-3.5 text-sm font-bold text-plum transition hover:bg-plum/5 disabled:opacity-30 disabled:pointer-events-none"
                  >
                    ← Quay lại
                  </button>

                  <div className="flex items-center gap-3">
                    ${step < 3 && html`
                      <button
                        onClick=${() => setStep(step + 1)}
                        className="rounded-full bg-brick px-8 py-3.5 text-sm font-bold text-white shadow-lg transition hover:bg-plum hover:scale-105"
                      >
                        Tiếp tục →
                      </button>
                    `}

                    ${step === 3 && html`
                      <button
                        disabled=${!selected.length || loading}
                        onClick=${runAnalysis}
                        className="rounded-full bg-brick px-9 py-4 text-sm font-extrabold text-white shadow-xl transition hover:bg-plum hover:scale-105 disabled:opacity-50 disabled:pointer-events-none flex items-center gap-2.5"
                      >
                        ${loading ? 'Đang phân tích dòng tiền...' : 'Chạy phân tích rổ dự án →'}
                      </button>
                    `}

                    ${step === 4 && result && html`
                      <button
                        onClick=${saveClientProfile}
                        className="rounded-full bg-plum px-8 py-3.5 text-sm font-bold text-white shadow-md transition hover:bg-brick flex items-center gap-2"
                      >
                        <${Save} size=${15} /> ${saved ? '✓ Đã lưu hồ sơ' : 'Lưu hồ sơ khách hàng'}
                      </button>
                    `}
                  </div>
                </div>
              </div>
            </main>

            <!-- DETAIL MODAL -->
            ${detail && html`
              <${WorkflowDetail}
                item=${detail}
                form=${form}
                onClose=${() => setDetail(null)}
                onPrint=${handlePrintDetail}
              />
            `}

            <!-- TOAST NOTIFICATION -->
            ${toastMsg && html`
              <div className="fixed bottom-6 right-6 z-[90] rounded-2xl bg-plum px-6 py-4 text-sm font-bold text-white shadow-2xl flex items-center gap-3 animate-bounce">
                <span>${toastMsg}</span>
              </div>
            `}

            <!-- PRINTABLE CONTAINERS (Hidden on screen, visible on print) -->
            ${printType === 'detail' && printItem && html`
              <${PrintDetailView} item=${printItem} form=${form} />
            `}
            ${printType === 'comparison' && result && html`
              <${PrintComparisonView} result=${result} form=${form} />
            `}
          </div>
        `;
      }

      function ClientsPage() {
        return html`<main className="screen-only min-h-screen bg-shell px-5 py-14 lg:px-10 lg:py-20">
          <div className="mx-auto max-w-[1440px]">
            <p className="text-xs font-extrabold uppercase tracking-wide text-brick">CLIENT CRM</p>
            <div className="mt-3 flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
              <div>
                <h1 className="text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Khách hàng của tôi.</h1>
                <p className="mt-4 text-lg leading-relaxed text-ink/55">Mở lại hồ sơ và tiếp tục các phiên phân tích đang thực hiện.</p>
              </div>
              <${Link} to="/dashboard" className="w-fit rounded-full bg-brick px-6 py-4 text-sm font-bold text-white transition hover:bg-plum">+ Tạo hồ sơ mới</${Link}>
            </div>
            <div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-4">
              ${CLIENTS.map((c, index) => html`<article key=${c.id} className="rounded-2xl border border-plum/10 bg-white p-6 shadow-lg transition hover:-translate-y-1">
                <div className="flex items-start justify-between">
                  <span className="grid h-12 w-12 place-items-center rounded-xl bg-plum text-sm font-bold text-white">${c.initials}</span>
                  <span className=${`rounded-full px-3 py-2 text-xs font-bold ${c.tone}`}>${c.status}</span>
                </div>
                <p className="mt-8 text-xs font-extrabold tracking-wide text-ink/35">KHÁCH HÀNG ${String(index + 1).padStart(2, '0')}</p>
                <h2 className="mt-2 text-xl font-bold leading-tight tracking-tight text-plum">${c.name}</h2>
                <div className="my-6 grid grid-cols-2 border-y border-plum/10 py-4">
                  <div><small className="text-xs font-bold text-ink/35">NGÂN SÁCH</small><strong className="mt-2 block text-base text-ink">${c.budget}</strong></div>
                  <div className="border-l border-plum/10 pl-4"><small className="text-xs font-bold text-ink/35">KHU VỰC</small><strong className="mt-2 block text-base text-ink">${c.area}</strong></div>
                </div>
                <${Link} to="/dashboard" className="flex items-center justify-between rounded-xl bg-[#F4F0EF] px-4 py-3.5 text-sm font-bold text-plum transition hover:bg-plum hover:text-white">
                  Xem phân tích <${Arrow} />
                </${Link}>
              </article>`)}
            </div>
          </div>
        </main>`;
      }

      function ProjectsPage() {
        return html`<main className="screen-only min-h-screen bg-[#F7F3F2] px-5 py-14 lg:px-10 lg:py-20">
          <div className="mx-auto max-w-[1440px]">
            <p className="text-xs font-extrabold uppercase tracking-wide text-brick">PROJECT VAULT</p>
            <h1 className="mt-3 text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Kho dự án.</h1>
            <p className="mt-4 max-w-2xl text-lg leading-relaxed text-ink/55">Kho dữ liệu chuẩn hóa để môi giới có thể tư vấn bằng cùng một ngôn ngữ tài chính.</p>
            <div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-3">
              ${PROJECTS.map((p, i) => html`<article key=${p.id} className="overflow-hidden rounded-2xl border border-plum/10 bg-white shadow-lg">
                <div className=${`noise flex h-40 items-end justify-between p-6 text-white ${i % 3 === 0 ? 'bg-plum' : i % 3 === 1 ? 'bg-brick' : 'bg-[#85505A]'}`}>
                  <span className="text-xs font-bold tracking-wide text-white/65">PROJECT / ${String(i + 1).padStart(2, '0')}</span>
                  <strong className="text-4xl font-extrabold tracking-tight">${p.fit}</strong>
                </div>
                <div className="p-6">
                  <p className="text-sm font-bold text-brick">${p.area}</p>
                  <h2 className="mt-2 text-2xl font-bold text-plum">${p.name}</h2>
                  <p className="mt-2 text-base text-ink/50">${p.rooms} · ${p.distance} km</p>
                  <div className="mt-5 flex flex-wrap gap-2">
                    ${p.amenities.map(a => html`<span className="rounded-full bg-[#F3EFEF] px-3 py-2 text-xs font-semibold text-plum">${a}</span>`)}
                  </div>
                  <div className="mt-6 flex items-center justify-between border-t border-plum/10 pt-5">
                    <span className="text-sm text-ink/45">Giá tham chiếu</span>
                    <b className="text-xl text-plum">${String(p.price).replace('.', ',')} tỷ VND</b>
                  </div>
                </div>
              </article>`)}
            </div>
          </div>
        </main>`;
      }

      function App() {
        const [role, setRole] = useState(() => localStorage.getItem('minfit-role') || 'broker');
        const logout = () => {
          localStorage.removeItem('minfit-role');
          setRole(null);
        };
        const loggedBroker = role === 'broker';
        const loggedAdmin = role === 'admin';

        return html`<div className="min-h-screen">
          <${Navbar} role=${role} onLogout=${logout} />
          <${Routes}>
            <${Route} path="/" element=${html`<${HomePage} />`} />
            <${Route} path="/auth/login" element=${html`<${AuthPage} onLogin=${setRole} />`} />
            <${Route} path="/auth/register" element=${html`<${AuthPage} mode="register" onLogin=${setRole} />`} />
            <${Route} path="/admin" element=${loggedAdmin ? html`<${AdminPage} />` : html`<${Navigate} to="/auth/login" replace />`} />
            <${Route} path="/dashboard" element=${loggedBroker ? html`<${WorkflowDashboard} />` : html`<${Navigate} to="/auth/login" replace />`} />
            <${Route} path="/workflow" element=${loggedBroker ? html`<${WorkflowDashboard} />` : html`<${Navigate} to="/auth/login" replace />`} />
            <${Route} path="/clients" element=${loggedBroker ? html`<${ClientsPage} />` : html`<${Navigate} to="/auth/login" replace />`} />
            <${Route} path="/projects" element=${html`<${ProjectsPage} />`} />
            <${Route} path="/analysis/:clientId" element=${loggedBroker ? html`<${WorkflowDashboard} />` : html`<${Navigate} to="/auth/login" replace />`} />
            <${Route} path="*" element=${html`<${Navigate} to="/" replace />`} />
          </${Routes}>
          <${Footer} />
        </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
    </script>
  </body>
</html>
