      window.addEventListener('error', function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:30px; margin:20px; background:#FFF0EF; border:2px solid #E05252; border-radius:16px; font-family:sans-serif; color:#9C2727;">' +
            '<h2 style="margin:0 0 10px 0;">🚨 Lỗi Thực Thi JavaScript:</h2>' +
            '<p style="font-size:14px; font-weight:bold;">' + (e.message || e.error) + '</p>' +
            '<p style="font-size:12px; color:#666;">File: ' + e.filename + ' : ' + e.lineno + '</p>' +
            '<pre style="background:#fff; padding:10px; border-radius:8px; overflow:auto; font-size:11px;">' + (e.error && e.error.stack ? e.error.stack : '') + '</pre>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML += '<div style="padding:20px; margin:20px; background:#FFF9E6; border:2px solid #D4A318; border-radius:16px; font-family:sans-serif; color:#856404;">' +
            '<h3>⚠️ Unhandled Promise Rejection:</h3><p>' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</p></div>';
        }
      });
    </script>

        const RouterContext = React.createContext({ pathname: window.location.pathname, navigate: (to) => { window.location.pathname = to; } });
        const RouterProvider = RouterContext.Provider;

        function BrowserRouter({ children }) {
          const [pathname, setPathname] = useState(window.location.pathname);
          
          useEffect(() => {
            const handlePopState = () => setPathname(window.location.pathname);
            window.addEventListener('popstate', handlePopState);
            return () => window.removeEventListener('popstate', handlePopState);
          }, []);

          const navigate = useCallback((to, options = {}) => {
            if (options && options.replace) {
              window.history.replaceState({}, '', to);
            } else {
              window.history.pushState({}, '', to);
            }
            setPathname(to.split('?')[0]);
            window.scrollTo(0, 0);
          }, []);

          return html`<${RouterProvider} value=${{ pathname, navigate }}>${children}</${RouterProvider}>`;
        }

        function useLocation() {
          return React.useContext(RouterContext);
        }

        function useNavigate() {
          const { navigate } = React.useContext(RouterContext);
          return navigate;
        }

        function Link({ to, className, children, onClick, ...props }) {
          const navigate = useNavigate();
          return html`<a
            href=${to || '#'}
            className=${className}
            onClick=${(e) => {
              if (to && !to.startsWith('#') && !to.startsWith('http') && !to.startsWith('mailto')) {
                e.preventDefault();
                navigate(to);
              }
              if (onClick) onClick(e);
            }}
            ...${props}
          >${children}</a>`;
        }

        function NavLink({ to, className, children, ...props }) {
          const { pathname } = useLocation();
          const isActive = pathname === to || (to !== '/' && pathname.startsWith(to));
          const finalClass = typeof className === 'function' ? className({ isActive }) : className;
          return html`<${Link} to=${to} className=${finalClass} ...${props}>${children}</${Link}>`;
        }

        function Routes({ children }) {
          const { pathname } = useLocation();
          const currentPath = pathname.length > 1 && pathname.endsWith('/') ? pathname.slice(0, -1) : pathname;
          let matched = null;
          let fallback = null;
          
          const flatChildren = React.Children.toArray(children).flat();
          flatChildren.forEach((child) => {
            if (child && child.props) {
              const { path, element } = child.props;
              if (path === currentPath && !matched) {
                matched = element;
              } else if (path === '*' && !fallback) {
                fallback = element;
              }
            }
          });
          return matched || fallback;
        }

        function Route({ path, element }) {
          return element;
        }

        function Navigate({ to, replace }) {
          const navigate = useNavigate();
          useEffect(() => {
            navigate(to, { replace });
          }, [navigate, to, replace]);
          return null;

          workplace_detail: '',
          workplace_lat: 21.0362,
          workplace_lng: 105.7906,
          transport_mode: 'motorbike',

          // Sức khỏe tài chính (VND)
          monthly_income: 85000000,
          available_cash: 2200000000,

          health_condition: 'healthy',
          lifestyle_level: 'moderate',
          essential_expenses: 24500000,

          discount_percent: 0,
          required_amenities: ['school', 'park', 'parking']
        });

        // Smart living cost auto-calculator
        useEffect(() => {
          const tier = 2;
          const baseMap = {
            1: { single: 10000000, young_couple: 16000000, family_with_children: 18000000, retired: 12000000 },
            2: { single: 8500000, young_couple: 13500000, family_with_children: 15000000, retired: 10000000 },

            4: { single: 5500000, young_couple: 8500000, family_with_children: 9500000, retired: 7000000 }
          };
          const eduMap = { none: 0, public: 2500000, private: 6500000, bilingual: 15000000, international: 30000000 };
          const healthMap = { healthy: 1200000, toddler: 2500000, chronic: 4500000 };
          const lifeMap = { frugal: 0, moderate: 3000000, liberal: 7000000 };

          const base = (baseMap[tier] || baseMap[2])[form.persona] || 15000000;
          const edu = form.persona === 'family_with_children' ? (form.child_count * (eduMap[form.school_type] || 6500000)) : 0;
          const health = healthMap[form.health_condition] || 1200000;
          const life = lifeMap[form.lifestyle_level] || 3000000;

          const total = base + edu + health + life;
          setForm(old => ({ ...old, essential_expenses: total }));
        }, [form.persona, form.child_count, form.school_type, form.health_condition, form.lifestyle_level, form.workplace_district]);

        const loadProjects = () => {
          fetch('/api/projects')
            .then(res => res.json())
            .then(data => {
              const items = data.projects || [];
              setProjects(items);
              if (!selected.length) {
                setSelected(items.slice(0, 3).map(p => p.id));
              }
            })
            .catch(() => setError('Không tải được danh sách dự án từ máy chủ.'));
        };

        useEffect(() => {
          loadProjects();
        }, []);

        const handleSyncMarket = () => {
          setSyncing(true);
          fetch('/api/projects/sync-market', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
              if (data.projects) setProjects(data.projects);
              showToast('⚡ ' + (data.message || 'Đã đồng bộ giá thị trường Hà Nội mới nhất!'));
            })
            .catch(() => showToast('Đồng bộ giá thị trường hoàn tất!'))
            .finally(() => setSyncing(false));
        };

        const update = (key) => (e) => {
          setForm(old => ({
            ...old,
            [key]: e.target.type === 'number' ? Number(e.target.value) : e.target.value
          }));

              <div className="space-y-1 text-xs">
                <div className="flex items-center gap-2">
                  <span className="inline-flex items-center rounded-md bg-green-50 px-2 py-0.5 text-[11px] font-bold text-green-700 ring-1 ring-inset ring-green-600/20">
                    Nghị định 13/2023/NĐ-CP & Miễn trừ độc lập
                  </span>
                  <strong className="text-plum font-bold">Điều khoản & Bảo mật Dữ liệu Khách hàng</strong>
                </div>
                <p className="text-ink/70 leading-relaxed">
                  MinFit cam kết bảo mật mọi dữ liệu tài chính thu nhập theo chuẩn mã hóa cục bộ. Các chỉ số (THB Ratio, Real FCF, Payment Shock) mang tính chất tham vấn đo lường vừa vặn độc lập, không thay thế văn bản thẩm định hạn mức tín dụng chính thức của Ngân hàng hoặc hợp đồng CĐT.
                </p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onClick=${handleAccept}
                  className="rounded-xl bg-plum hover:bg-brick px-4 py-2.5 text-xs font-bold text-white transition shadow-md cursor-pointer"
                >
                  Tôi đã hiểu & Đồng ý
                </button>
              </div>
            </div>
          </aside>
        `;
      }

      function App() {
        const [role, setRole] = useState(() => {
          return localStorage.getItem('minfit_role') || null;
        });

        const handleLogin = (selectedRole) => {
          setRole(selectedRole);
          localStorage.setItem('minfit_role', selectedRole);
        };

        const handleLogout = () => {
          setRole(null);
          localStorage.removeItem('minfit_role');
          window.location.href = '/';
        };

        const handleSwitchRole = (newRole) => {
          setRole(newRole);
          localStorage.setItem('minfit_role', newRole);
        };

        return html`<div className="min-h-screen">
          <${Navbar} role=${role} onLogout=${handleLogout} onSwitchRole=${handleSwitchRole} />
          <${Routes}>
            <${Route} path="/" element=${html`<${HomePage} />`} />
            <${Route} path="/login" element=${html`<${LoginPage} onLogin=${handleLogin} />`} />
            <${Route} path="/dashboard" element=${html`<${WorkflowDashboard} />`} />
            <${Route} path="/workflow" element=${html`<${WorkflowDashboard} />`} />
            <${Route} path="/inventory" element=${html`<${InventoryPage} />`} />
            <${Route} path="/clients" element=${html`<${ClientsPage} />`} />
            <${Route}
              path="/admin"
              element=${role === 'admin'
                ? html`<${AdminProjectsPage} onSwitchToBroker=${() => handleSwitchRole('broker')} />`
                : html`<${Navigate} to="/login" replace />`
              }
            />
            <${Route}
              path="/admin/projects"
              element=${role === 'admin'
                ? html`<${AdminProjectsPage} onSwitchToBroker=${() => handleSwitchRole('broker')} />`
                : html`<${Navigate} to="/login" replace />`
              }
            />
            <${Route} path="*" element=${html`<${Navigate} to="/" replace />`} />
          </${Routes}>
          <${Footer} />
          <${ConsentBanner} />
        </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
      })();
    </script>
  </body>
</html>
