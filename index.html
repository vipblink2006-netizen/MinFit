<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MinFit — PropTech | Real Estate Financial Fit" />
    <title>MinFit · Real Estate Financial Fit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { plum:'#64242F', brick:'#B44446', shell:'#DFD9D8', ink:'#291D20' }, fontFamily:{ sans:['Be Vietnam Pro','sans-serif'] }, boxShadow:{ card:'0 18px 52px rgba(100,36,47,.10)' } } } };</script>
    <style>
      * { box-sizing: border-box; }
      body { margin:0; background:#DFD9D8; color:#291D20; font-family:'Be Vietnam Pro',sans-serif; -webkit-font-smoothing:antialiased; }
      button,input,select { font:inherit; }
      .noise { background-image:radial-gradient(rgba(255,255,255,.12) .7px,transparent .7px); background-size:8px 8px; }
      .hide-scrollbar::-webkit-scrollbar { display:none; }
      .hide-scrollbar { scrollbar-width:none; }
      input[type=range] { accent-color:#B44446; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useMemo, useState } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { BrowserRouter, Link, NavLink, Navigate, Route, Routes, useNavigate, useParams } from 'https://esm.sh/react-router-dom@6.30.1?deps=react@18.3.1,react-dom@18.3.1';
      import htm from 'https://esm.sh/htm@3.1.1';
      const html = htm.bind(React.createElement);

      const PROJECTS = [
        { id:'lotus', name:'Lotus Garden Tân Phú', area:'Tân Phú', price:3.9, rooms:'2PN · 70 m²', distance:9.2, fit:88, amenities:['Trường học','Công viên','Chỗ đỗ xe'] },
        { id:'cedar', name:'Cedar Park Bình Thạnh', area:'Bình Thạnh', price:6.1, rooms:'2PN · 76 m²', distance:3.4, fit:92, amenities:['Công viên','Hồ bơi','Chỗ đỗ xe'] },
        { id:'greenloop', name:'Green Loop Thủ Đức', area:'Thủ Đức', price:3.7, rooms:'2PN · 68 m²', distance:12.8, fit:84, amenities:['Công viên','Yên tĩnh','Chỗ đỗ xe'] },
        { id:'aqua', name:'Aqua Vista Quận 7', area:'Quận 7', price:5.8, rooms:'3PN · 88 m²', distance:10.6, fit:86, amenities:['Trường học','Hồ bơi','Công viên'] },
        { id:'airport', name:'Airport Link Tân Bình', area:'Tân Bình', price:5.2, rooms:'2PN · 72 m²', distance:7.1, fit:82, amenities:['Metro','Chỗ đỗ xe','Trường học'] },
        { id:'harbor', name:'Harbor Point Nhà Bè', area:'Nhà Bè', price:4.6, rooms:'2PN · 78 m²', distance:15.5, fit:78, amenities:['Yên tĩnh','Hồ bơi','Công viên'] },
      ];
      const CLIENTS = [
        { id:'01', name:'Gia đình Anh Minh', initials:'AM', budget:'4,2 tỷ', area:'Tân Phú', status:'Đang tư vấn', tone:'bg-[#FCE8E5] text-[#9C3E40]' },
        { id:'02', name:'Chị Phương Anh', initials:'PA', budget:'6,5 tỷ', area:'Bình Thạnh', status:'Đã phân tích', tone:'bg-[#F6EECB] text-[#806B1F]' },
        { id:'03', name:'Vợ chồng Đức · An', initials:'ĐA', budget:'3,8 tỷ', area:'Thủ Đức', status:'Đã chốt', tone:'bg-[#DDEDE1] text-[#276342]' },
        { id:'04', name:'Gia đình Cô Hạnh', initials:'CH', budget:'5,1 tỷ', area:'Quận 7', status:'Đang tư vấn', tone:'bg-[#FCE8E5] text-[#9C3E40]' },
      ];
      const BROKERS = [
        { id:'br-01', name:'Nguyễn Minh Anh', email:'minhanh@minfit.vn', joined:'12/03/2026', files:28, status:'Active' },
        { id:'br-02', name:'Trần Phương Linh', email:'linh.tran@minfit.vn', joined:'18/03/2026', files:16, status:'Active' },
        { id:'br-03', name:'Lê Quốc Bảo', email:'bao.le@minfit.vn', joined:'21/03/2026', files:7, status:'Banned' },
        { id:'br-04', name:'Phạm Thanh Trúc', email:'truc.pham@minfit.vn', joined:'27/03/2026', files:42, status:'Active' },
      ];
      const money = (v) => `${Number(v).toFixed(1).replace('.', ',')} triệu`;
      const clamp = (v,min,max) => Math.min(max,Math.max(min,v));

      function Arrow() { return html`<svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 6l6 6-6 6" /></svg>`; }
      function Logo({ light=false }) { return html`<${Link} to="/" className="group flex items-center gap-3"><span className=${`grid h-10 w-10 place-items-center rounded-full border text-base font-extrabold transition group-hover:rotate-6 ${light?'border-white/30 text-white':'border-plum/20 text-plum'}`}>M</span><span className="flex flex-col"><strong className=${`text-[22px] font-extrabold leading-tight tracking-normal ${light?'text-white':'text-plum'}`}>MinFit<span className="text-brick">.</span></strong><small className=${`text-[8px] font-semibold leading-relaxed tracking-wide ${light?'text-white/55':'text-plum/50'}`}>PropTech | Real Estate Financial Fit</small></span></${Link}>`; }

      function Navbar({ role, onLogout }) {
        const nav = ({isActive}) => `relative py-7 text-sm font-semibold tracking-normal transition after:absolute after:bottom-4 after:left-0 after:h-0.5 after:bg-brick after:transition-all ${isActive?'text-plum after:w-full':'text-[#756568] hover:text-plum after:w-0 hover:after:w-full'}`;
        if (!role) return html`<header className="sticky top-0 z-50 border-b border-plum/10 bg-[#F7F3F2]/95 backdrop-blur-xl"><div className="mx-auto flex h-[88px] max-w-[1440px] items-center justify-between px-5 lg:px-10"><${Logo} /><nav className="hidden items-center gap-10 md:flex"><${NavLink} to="/" end className=${nav}>Trang chủ</${NavLink}><a href="/#features" className="py-7 text-sm font-semibold text-[#756568] transition hover:text-plum">Tính năng</a><a href="/#pricing" className="py-7 text-sm font-semibold text-[#756568] transition hover:text-plum">Bảng giá</a></nav><div className="flex items-center gap-3"><${Link} to="/auth/login" className="hidden rounded-full px-4 py-3 text-sm font-bold text-plum transition hover:bg-plum/5 sm:block">Đăng nhập</${Link}><${Link} to="/auth/register" className="rounded-full bg-brick px-5 py-3 text-sm font-bold text-white shadow-lg shadow-brick/20 transition hover:bg-plum">Đăng ký miễn phí</${Link}></div></div></header>`;
        const dashboardLink = role === 'admin' ? '/admin' : '/dashboard';
        return html`<header className="sticky top-0 z-50 border-b border-plum/10 bg-[#F7F3F2]/95 backdrop-blur-xl"><div className="mx-auto flex h-[88px] max-w-[1440px] items-center justify-between px-5 lg:px-10"><${Logo} /><nav className="hidden items-center gap-10 md:flex"><${NavLink} to=${dashboardLink} className=${nav}>Dashboard</${NavLink}>${role==='broker' && html`<${NavLink} to="/clients" className=${nav}>Khách hàng của tôi</${NavLink}>`}${role==='admin' && html`<${NavLink} to="/admin" className=${nav}>Tài khoản môi giới</${NavLink}>`}</nav><details className="relative"><summary className="flex cursor-pointer list-none items-center gap-3 rounded-full border border-plum/10 bg-white px-3 py-2 text-sm font-bold text-plum"><span className="grid h-8 w-8 place-items-center rounded-full bg-plum text-xs text-white">${role==='admin'?'AD':'MA'}</span><span className="hidden sm:block">${role==='admin'?'Super Admin':'Minh Anh'}</span><span className="text-xs text-ink/40">⌄</span></summary><div className="absolute right-0 top-14 w-48 rounded-2xl border border-plum/10 bg-white p-2 shadow-2xl"><p className="px-3 py-2 text-xs leading-relaxed text-ink/50">${role==='admin'?'Quản trị hệ thống':'Workspace môi giới'}</p><button onClick=${onLogout} className="w-full rounded-xl px-3 py-2 text-left text-sm font-semibold text-brick hover:bg-[#FCE8E5]">Đăng xuất</button></div></details></div></header>`;
      }
      function Footer() { return html`<footer className="bg-[#4F1C25] text-white"><div className="mx-auto flex max-w-[1440px] flex-col gap-7 px-6 py-14 md:flex-row md:items-end md:justify-between lg:px-10"><div><${Logo} light=${true} /><p className="mt-5 max-w-md text-base leading-relaxed text-white/55">Nền tảng đo lường độ vừa vặn tài chính cho từng quyết định mua nhà.</p></div><div className="flex flex-wrap gap-7 text-sm leading-relaxed text-white/60"><${Link} to="/" className="hover:text-white">Trang chủ</${Link}><${Link} to="/auth/login" className="hover:text-white">Đăng nhập</${Link}><span>© 2026 MinFit</span></div></div></footer>`; }

      function HomePage() {
        return html`<main><section className="noise overflow-hidden bg-plum text-white"><div className="mx-auto grid min-h-[720px] max-w-[1440px] items-center gap-14 px-6 py-20 lg:grid-cols-[1.12fr_.88fr] lg:px-10"><div><div className="mb-7 flex items-center gap-3 text-xs font-bold uppercase tracking-wide text-[#F3B6B5]"><span className="h-px w-10 bg-[#F3B6B5]"></span>PROPTECH CHO MÔI GIỚI & NHÀ ĐẦU TƯ BẤT ĐỘNG SẢN</div><h1 className="max-w-4xl text-5xl font-extrabold leading-tight tracking-tight lg:text-7xl">Dẫn đầu xu hướng <span className="text-[#FC8F8F]">Thẩm định Dòng tiền</span> Bất động sản</h1><p className="mt-8 max-w-2xl text-lg leading-relaxed tracking-normal text-white/70">Công cụ tính toán phương án vay, đo lường độ vừa vặn tài chính (Live Fit Score) và cảnh báo rủi ro dòng tiền trước khi khách hàng xuống tiền.</p><div className="mt-10 flex flex-col items-start gap-4 sm:flex-row"><${Link} to="/auth/register" className="flex items-center gap-6 rounded-full bg-brick px-7 py-4 text-base font-bold tracking-normal shadow-xl shadow-black/15 transition hover:bg-white hover:text-plum">Bắt đầu miễn phí <${Arrow} /></${Link}><a href="#features" className="flex items-center gap-6 rounded-full border border-white/50 px-7 py-4 text-base font-bold tracking-normal text-white transition hover:bg-white hover:text-plum">Xem Demo <${Arrow} /></a></div></div><div className="relative hidden min-h-[470px] lg:block"><div className="absolute right-0 top-9 h-[380px] w-[310px] rotate-6 rounded-[180px_180px_32px_32px] bg-[#FC8F8F]"></div><div className="absolute right-24 top-28 w-[330px] rounded-[30px] border border-white/30 bg-white/95 p-7 text-ink shadow-2xl"><div className="flex items-start justify-between"><div><span title="Điểm tương thích tài chính & mức độ an toàn dòng tiền" className="cursor-help text-[11px] font-extrabold tracking-wide text-brick">LIVE FIT SCORE ⓘ</span><p className="mt-1 text-xs leading-relaxed text-ink/45">Độ tương thích tài chính & an toàn dòng tiền</p></div><span className="rounded-full bg-[#E4F0E7] px-3 py-1 text-[10px] font-bold tracking-normal text-[#38674A]">AN TOÀN</span></div><div className="my-7 flex items-end justify-between"><strong className="text-7xl font-extrabold leading-none tracking-tight text-plum">88</strong><span className="pb-2 text-xs font-bold text-ink/40">/ 100</span></div><div className="h-2 overflow-hidden rounded-full bg-shell"><div className="h-full w-[88%] rounded-full bg-brick"></div></div><div className="mt-7 grid grid-cols-2 gap-3"><div className="rounded-2xl bg-[#F3EFEF] p-4"><small className="font-bold tracking-wide text-ink/40">DTI CAO NHẤT</small><b className="mt-2 block text-xl tracking-normal text-plum">34,8%</b></div><div className="rounded-2xl bg-[#F3EFEF] p-4"><small className="font-bold tracking-wide text-ink/40">FCF THẤP NHẤT</small><b className="mt-2 block text-xl tracking-normal text-plum">18,5 tr</b></div></div></div></div></div></section>
          <section className="bg-shell px-6 py-24 lg:px-10 lg:py-32"><div className="mx-auto max-w-[1440px]"><div className="mb-14 grid gap-8 lg:grid-cols-2"><div><p className="text-xs font-extrabold uppercase tracking-wide text-brick">VỀ MINFIT</p><h2 className="mt-4 text-3xl font-extrabold leading-tight tracking-tight text-plum lg:text-5xl">Đo lường độ vừa vặn tài chính cho từng quyết định mua nhà.</h2></div><p className="self-end max-w-2xl text-lg leading-relaxed tracking-normal text-[#6E5D60]">MinFit (Financial Fit) giúp môi giới và người mua nhà làm rõ bài toán dòng tiền: tháng nào áp lực nhất, tỷ lệ vay bao nhiêu là an toàn và khoảng đệm tài chính còn lại bao nhiêu.</p></div><div id="features" className="grid gap-5 lg:grid-cols-3"><${Feature} number="01" title="Cảnh báo DTI theo từng tháng" text="Theo dõi tỷ lệ trả nợ qua từng mốc lãi suất để thấy vùng an toàn trước khi tư vấn." color="bg-brick" /><${Feature} number="02" title="Chấm điểm tiện ích theo chân dung" text="Ghép trường học, công viên và nhu cầu sống với đúng khách hàng đang tìm nhà." color="bg-[#D79B54]" /><${Feature} number="03" title="Mô phỏng lãi suất thả nổi" text="Nhìn thấy cú sốc thanh toán, FCF và quỹ dự phòng trong toàn kỳ vay." color="bg-[#476B58]" /></div></div></section>
          <section id="pricing" className="bg-white px-6 py-24 lg:px-10"><div className="mx-auto flex max-w-[1440px] flex-col items-start justify-between gap-8 rounded-[34px] bg-brick p-10 text-white md:flex-row md:items-center lg:p-16"><div><p className="text-xs font-bold uppercase tracking-wide text-white/60">BẮT ĐẦU MIỄN PHÍ</p><h2 className="mt-4 max-w-3xl text-3xl font-extrabold leading-tight tracking-tight lg:text-5xl">Một workspace rõ ràng cho mọi cuộc tư vấn.</h2><p className="mt-5 text-base leading-relaxed text-white/70">Tạo tài khoản môi giới và bắt đầu kiểm tra phương án đầu tiên trong vài phút.</p></div><${Link} to="/auth/register" className="flex shrink-0 items-center gap-6 rounded-full bg-white px-7 py-4 text-base font-bold tracking-normal text-plum transition hover:scale-105">Đăng ký miễn phí <${Arrow} /></${Link}></div></section></main>`;
      }
      function Feature({ number,title,text,color }) { return html`<article className="min-h-[300px] rounded-2xl border border-plum/10 bg-white p-8 shadow-lg transition duration-300 hover:-translate-y-1"><div className="flex items-start justify-between"><span className="text-xs font-bold tracking-wide text-plum/35">${number}</span><span className=${`h-3 w-3 rounded-full ${color}`}></span></div><div className="mt-20"><h3 className="text-2xl font-bold leading-tight tracking-tight text-plum">${title}</h3><p className="mt-5 text-base leading-relaxed tracking-normal text-[#736266]">${text}</p></div></article>`; }

      function AuthPage({ mode='login', onLogin }) {
        const navigate = useNavigate(); const [role,setRole] = useState('broker'); const [email,setEmail] = useState(''); const [password,setPassword] = useState('');
        const register = mode === 'register';
        const submit = (e) => { e.preventDefault(); localStorage.setItem('minfit-role',role); onLogin(role); navigate(role==='admin'?'/admin':'/dashboard'); };
        return html`<main className="grid min-h-[calc(100vh-88px)] place-items-center bg-shell px-5 py-14"><div className="grid w-full max-w-5xl overflow-hidden rounded-3xl bg-white shadow-2xl lg:grid-cols-[.85fr_1.15fr]"><div className="noise hidden bg-plum p-12 text-white lg:block"><${Logo} light=${true} /><div className="mt-28"><p className="text-xs font-bold uppercase tracking-wide text-[#F3B6B5]">Workspace B2B SaaS</p><h1 className="mt-5 text-4xl font-extrabold leading-tight tracking-tight">Một nơi để mọi quyết định mua nhà có căn cứ.</h1><p className="mt-6 text-base leading-relaxed text-white/65">Quản lý khách hàng, mô phỏng dòng tiền và cộng tác trong một workspace duy nhất.</p></div></div><div className="p-7 sm:p-12"><div className="mb-10 lg:hidden"><${Logo} /></div><p className="text-xs font-extrabold uppercase tracking-wide text-brick">MINFIT ACCOUNT</p><h1 className="mt-3 text-3xl font-extrabold leading-tight tracking-tight text-plum">${register?'Tạo workspace miễn phí':'Chào mừng bạn trở lại'}</h1><p className="mt-3 text-base leading-relaxed text-ink/55">${register?'Bắt đầu xây dựng quy trình tư vấn chuyên nghiệp.':'Đăng nhập để tiếp tục phiên thẩm định của bạn.'}</p><form onSubmit=${submit} className="mt-8 space-y-5"><label className="block"><span className="mb-2 block text-sm font-bold tracking-normal text-plum">Email công việc</span><input required type="email" value=${email} onChange=${e=>setEmail(e.target.value)} placeholder="you@company.com" className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick focus:ring-4 focus:ring-brick/10" /></label><label className="block"><span className="mb-2 block text-sm font-bold tracking-normal text-plum">Mật khẩu</span><input required type="password" minLength="6" value=${password} onChange=${e=>setPassword(e.target.value)} placeholder="••••••••" className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick focus:ring-4 focus:ring-brick/10" /></label><label className="block"><span className="mb-2 block text-sm font-bold tracking-normal text-plum">Vai trò demo</span><select value=${role} onChange=${e=>setRole(e.target.value)} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick focus:ring-4 focus:ring-brick/10"><option value="broker">Môi giới · Broker workspace</option><option value="admin">Super Admin · Quản trị hệ thống</option></select></label><button className="flex w-full items-center justify-between rounded-xl bg-brick px-5 py-4 text-base font-bold tracking-normal text-white shadow-lg shadow-brick/20 transition hover:bg-plum"><span>${register?'Tạo tài khoản':'Đăng nhập'}</span><${Arrow} /></button></form><p className="mt-7 text-center text-sm leading-relaxed text-ink/55">${register?'Đã có tài khoản?':'Chưa có tài khoản?'} <${Link} to=${register?'/auth/login':'/auth/register'} className="font-bold text-brick hover:text-plum">${register?'Đăng nhập':'Đăng ký miễn phí'}</${Link}></p><p className="mt-6 text-center text-xs leading-relaxed text-ink/35">Bản demo: chọn vai trò để xem đúng luồng phân quyền.</p></div></div></main>`;
      }

      function AdminPage() {
        const [rows,setRows] = useState(BROKERS);
        const toggle = (id) => setRows(old=>old.map(row=>row.id===id?{...row,status:row.status==='Active'?'Banned':'Active'}:row));
        return html`<main className="min-h-screen bg-shell px-5 py-14 lg:px-10 lg:py-20"><div className="mx-auto max-w-[1440px]"><div className="flex flex-col gap-7 md:flex-row md:items-end md:justify-between"><div><p className="text-xs font-extrabold uppercase tracking-wide text-brick">SUPER ADMIN CONSOLE</p><h1 className="mt-4 text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Quản trị tài khoản môi giới.</h1><p className="mt-4 max-w-2xl text-lg leading-relaxed text-ink/55">Theo dõi tenant, dung lượng hồ sơ khách hàng và trạng thái truy cập trên toàn hệ thống MinFit.</p></div><div className="rounded-2xl bg-white px-6 py-5 shadow-lg"><small className="block text-xs font-bold uppercase tracking-wide text-ink/40">TENANTS ACTIVE</small><strong className="mt-2 block text-3xl font-extrabold tracking-tight text-plum">${rows.filter(row=>row.status==='Active').length}/${rows.length}</strong></div></div><div className="mt-12 overflow-hidden rounded-3xl border border-plum/10 bg-white shadow-card"><div className="overflow-x-auto"><table className="w-full min-w-[760px] text-left"><thead className="bg-[#F7F3F2] text-xs font-extrabold uppercase tracking-wide text-ink/45"><tr><th className="px-7 py-5">Môi giới</th><th className="px-7 py-5">Ngày đăng ký</th><th className="px-7 py-5">File khách hàng</th><th className="px-7 py-5">Trạng thái</th><th className="px-7 py-5 text-right">Hành động</th></tr></thead><tbody className="divide-y divide-plum/10">${rows.map(row=>html`<tr key=${row.id} className="text-sm"><td className="px-7 py-6"><strong className="block text-base font-bold text-plum">${row.name}</strong><span className="mt-1 block text-sm leading-relaxed text-ink/50">${row.email}</span></td><td className="px-7 py-6 text-ink/60">${row.joined}</td><td className="px-7 py-6 font-bold text-plum">${row.files} hồ sơ</td><td className="px-7 py-6"><span className=${`rounded-full px-3 py-2 text-xs font-bold tracking-normal ${row.status==='Active'?'bg-[#DDEDE1] text-[#276342]':'bg-[#FCE8E5] text-[#9C3E40]'}`}>${row.status}</span></td><td className="px-7 py-6 text-right"><button onClick=${()=>toggle(row.id)} className=${`rounded-xl px-4 py-2.5 text-xs font-bold tracking-normal transition ${row.status==='Active'?'border border-brick/20 text-brick hover:bg-[#FCE8E5]':'bg-brick text-white hover:bg-plum'}`}>${row.status==='Active'?'Khóa tài khoản':'Kích hoạt'}</button></td></tr>`)}</tbody></table></div></div></div></main>`;
      }

      function compute(form) { return PROJECTS.map(p=>{ const principal=p.price*1000*(form.ltv/100), r=form.rate/1200, n=form.years*12; const pmt=r===0?principal/n:principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1); const stress=pmt*(1+Math.max(form.floatRate-form.rate,0)/Math.max(form.rate,1)*.52); const dti=(stress+form.debt)/Math.max(form.income,1)*100; const fcf=form.income-stress-form.debt-form.expenses-1.2; const reserve=form.cash*1000-p.price*1000*(1-form.ltv/100); const survival=reserve>0?reserve/Math.max(stress+form.debt+form.expenses,1):0; const fit=Math.round(clamp(p.fit*.55+clamp(100-Math.max(dti-30,0)*2.2-Math.max(-fcf,0)*3,20,100)*.45,0,99)); return {...p,payment:stress,dti,fcf,survival,fit}; }).sort((a,b)=>b.fit-a.fit).slice(0,3); }
      function Field({label,children}) { return html`<label className="block"><span className="mb-2 block text-sm font-bold tracking-normal text-plum">${label}</span>${children}</label>`; }
      function ResultCard({item,rank}) { const safe=item.dti<=36&&item.fcf>=10, watch=item.dti<=45&&item.fcf>=0; const label=safe?'An toàn':watch?'Cân nhắc':'Rủi ro cao'; const tag=safe?'bg-[#DDEDE1] text-[#276342]':watch?'bg-[#F6EECB] text-[#806B1F]':'bg-[#FCE8E5] text-[#9C3E40]'; return html`<article className="overflow-hidden rounded-2xl border border-plum/10 bg-white shadow-lg"><div className="flex items-start justify-between p-6 lg:p-7"><div><p className="text-xs font-extrabold uppercase tracking-wide text-brick">TOP ${String(rank).padStart(2,'0')} · PHƯƠNG ÁN ĐỀ XUẤT</p><h3 className="mt-3 text-2xl font-bold leading-tight tracking-tight text-plum">${item.name}</h3><p className="mt-2 text-base leading-relaxed tracking-normal text-ink/50">${item.area} · ${item.rooms} · ${item.distance} km đến nơi làm việc</p></div><div className="text-right"><strong className="block text-5xl font-extrabold leading-none tracking-tight text-plum">${item.fit}</strong><span className="text-xs font-bold tracking-wide text-ink/35">FIT SCORE</span></div></div><div className="grid gap-5 border-y border-plum/10 bg-[#F8F5F4] p-6 sm:grid-cols-4 lg:p-7"><${Metric} label="Giá tham chiếu" value=${`${String(item.price).replace('.',',')} tỷ`} /><${Metric} label="PMT cao nhất" value=${money(item.payment)} /><${Metric} label="DTI cao nhất" value=${`${item.dti.toFixed(1)}%`} alert=${item.dti>45?'risk':item.dti>36?'watch':''} /><${Metric} label="FCF thấp nhất" value=${money(item.fcf)} alert=${item.fcf<0?'risk':item.fcf<10?'watch':''} /></div><div className="flex flex-col gap-4 p-6 sm:flex-row sm:items-center sm:justify-between lg:p-7"><div className="flex items-center gap-3"><span className=${`rounded-full px-3 py-2 text-xs font-bold tracking-normal ${tag}`}>${label}</span><span className="text-sm leading-relaxed text-ink/50">Quỹ dự phòng: ${item.survival.toFixed(1)} tháng</span></div><span className="text-sm font-bold text-brick">Xem toàn bộ dòng tiền →</span></div></article>`; }
      function Metric({label,value,alert}) { const color=alert==='risk'?'text-brick':alert==='watch'?'text-[#9A6B22]':'text-plum'; return html`<div><small className="block text-xs font-bold uppercase tracking-wide text-ink/40">${label}</small><strong className=${`mt-2 block text-xl font-extrabold tracking-normal ${color}`}>${value}</strong></div>`; }

      function BrokerDashboard({clientId='new'}) {
        const params=useParams(); const resolvedClientId=params.clientId||clientId; const existing=CLIENTS.find(c=>c.id===resolvedClientId); const [form,setForm]=useState({persona:'Gia đình có con',income:100,cash:2,debt:0,expenses:25,ltv:70,years:20,rate:7.5,floatRate:13.5}); const [submitted,setSubmitted]=useState(form); const results=useMemo(()=>compute(submitted),[submitted]); const update=(key)=>(e)=>setForm(old=>({...old,[key]:e.target.type==='number'||e.target.type==='range'?Number(e.target.value):e.target.value})); const submit=(e)=>{e.preventDefault();setSubmitted({...form});};
        return html`<main className="min-h-screen bg-shell px-4 py-10 lg:px-10 lg:py-16"><div className="mx-auto max-w-[1440px]">${resolvedClientId==='dashboard'&&html`<section className="mb-9"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">BROKER WORKSPACE</p><div className="mt-3 flex flex-col gap-6 md:flex-row md:items-end md:justify-between"><div><h1 className="text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Khách hàng của tôi.</h1><p className="mt-3 text-lg leading-relaxed text-ink/55">Quản lý hồ sơ và mở lại phân tích tài chính trong một nơi.</p></div><${Link} to="/analysis/new" className="w-fit rounded-full bg-brick px-6 py-4 text-sm font-bold text-white transition hover:bg-plum">+ Tạo hồ sơ mới</${Link}></div><div className="mt-7 flex gap-4 overflow-x-auto pb-2">${CLIENTS.map(c=>html`<${Link} key=${c.id} to=${`/analysis/${c.id}`} className="min-w-[220px] rounded-2xl border border-plum/10 bg-white p-5 shadow-lg transition hover:-translate-y-1"><div className="flex items-center gap-3"><span className="grid h-10 w-10 place-items-center rounded-xl bg-plum text-xs font-bold text-white">${c.initials}</span><div><strong className="block text-sm font-bold text-plum">${c.name}</strong><span className="text-xs leading-relaxed text-ink/45">${c.budget} · ${c.area}</span></div></div><span className=${`mt-4 inline-block rounded-full px-2.5 py-1 text-[10px] font-bold tracking-normal ${c.tone}`}>${c.status}</span></${Link}>`)}</div></section>`}<div className="mb-7 flex flex-col gap-3 md:flex-row md:items-end md:justify-between"><div><p className="text-xs font-extrabold uppercase tracking-wide text-brick">${existing?`KHÁCH HÀNG ${existing.id}`:'ANALYSIS WORKSPACE'}</p><h1 className="mt-2 text-3xl font-extrabold leading-tight tracking-tight text-plum lg:text-5xl">${existing?existing.name:'Phân tích khách hàng mới'}</h1><p className="mt-3 text-base leading-relaxed tracking-normal text-ink/55">Nhập dữ liệu để đo Live Fit Score và tìm Top 3 phương án phù hợp.</p></div><span className="flex items-center gap-2 text-sm font-semibold text-ink/50"><i className="h-2.5 w-2.5 rounded-full bg-[#4E8B67]"></i>Mô hình đã sẵn sàng</span></div><div className="grid items-start gap-7 lg:grid-cols-[35%_65%]"><aside className="lg:sticky lg:top-[110px]"><form onSubmit=${submit} className="rounded-2xl border border-plum/10 bg-white p-6 shadow-lg lg:p-7"><div className="border-b border-plum/10 pb-5"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">DỮ LIỆU ĐẦU VÀO</p><h2 className="mt-2 text-2xl font-bold leading-tight tracking-tight text-plum">Hồ sơ & cấu hình vay</h2></div><div className="hide-scrollbar mt-6 max-h-[calc(100vh-320px)] space-y-6 overflow-y-auto pr-1"><${Field} label="Chân dung"><select value=${form.persona} onChange=${update('persona')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick"><option>Gia đình có con</option><option>Vợ chồng trẻ</option><option>Độc thân</option><option>Người lớn tuổi / Hưu trí</option></select></${Field}><div className="border-t border-plum/10 pt-6"><h3 className="mb-4 text-sm font-extrabold uppercase tracking-wide text-plum">Tài chính · triệu đồng/tháng</h3><div className="grid gap-4 sm:grid-cols-2"><${Field} label="Thu nhập"><input type="number" min="10" value=${form.income} onChange=${update('income')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}><${Field} label="Chi phí thiết yếu"><input type="number" min="1" value=${form.expenses} onChange=${update('expenses')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}><${Field} label="Tiền mặt · tỷ"><input type="number" min="0" step=".1" value=${form.cash} onChange=${update('cash')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}><${Field} label="Nợ hiện hữu"><input type="number" min="0" value=${form.debt} onChange=${update('debt')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}></div></div><div className="border-t border-plum/10 pt-6"><h3 className="mb-4 text-sm font-extrabold uppercase tracking-wide text-plum">Cấu hình khoản vay</h3><div className="space-y-5"><${Field} label=${`Tỷ lệ vay LTV · ${form.ltv}%`}><input type="range" min="0" max="90" step="5" value=${form.ltv} onChange=${update('ltv')} className="w-full" /></${Field}><div className="grid gap-4 sm:grid-cols-2"><${Field} label="Kỳ hạn · năm"><input type="number" min="10" max="30" value=${form.years} onChange=${update('years')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}><${Field} label="Lãi ưu đãi · %"><input type="number" min="0" step=".1" value=${form.rate} onChange=${update('rate')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}></div><${Field} label="Lãi thả nổi giả định · %"><input type="number" min="0" step=".1" value=${form.floatRate} onChange=${update('floatRate')} className="w-full rounded-xl border border-plum/15 bg-[#F8F5F4] px-4 py-3.5 text-base tracking-normal outline-none focus:border-brick" /></${Field}></div></div></div><button className="mt-7 flex w-full items-center justify-between rounded-xl bg-brick px-5 py-4 text-base font-bold tracking-normal text-white shadow-lg shadow-brick/20 transition hover:bg-plum"><span>Phân tích an toàn</span><${Arrow} /></button></form></aside><section className="min-w-0"><div className="mb-6 rounded-2xl bg-plum p-7 text-white shadow-lg lg:p-9"><p className="text-xs font-extrabold uppercase tracking-wide text-[#F3B6B5]">KẾT QUẢ THẨM ĐỊNH</p><div className="mt-3 flex flex-col justify-between gap-6 md:flex-row md:items-end"><div><h2 className="text-3xl font-extrabold leading-tight tracking-tight lg:text-5xl">Top 3 phương án vừa sức nhất.</h2><p className="mt-4 text-base leading-relaxed tracking-normal text-white/65">${submitted.persona} · LTV ${submitted.ltv}% · Lãi suất ${submitted.rate}% → ${submitted.floatRate}% · ${submitted.years} năm.</p></div><div className="flex items-end gap-2"><strong className="text-6xl font-extrabold leading-none tracking-tight">${results[0].fit}</strong><span className="mb-2 text-xs font-bold tracking-wide text-white/50">FIT SCORE CAO NHẤT</span></div></div></div><div className="space-y-5">${results.map((item,index)=>html`<${ResultCard} key=${item.id} item=${item} rank=${index+1} />`)}</div><div className="mt-5 rounded-2xl border border-brick/20 bg-[#F7E9E7] p-6"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">LƯU Ý TƯ VẤN</p><p className="mt-3 text-base leading-relaxed tracking-normal text-[#6F5357]">Kết quả mô phỏng theo dữ liệu đầu vào. Trước khi đặt cọc, cần xác minh pháp lý, bảng giá thực tế và lãi suất ngân hàng.</p></div></section></div></div></main>`;
      }

      function ClientsPage() { return html`<main className="min-h-screen bg-shell px-5 py-14 lg:px-10 lg:py-20"><div className="mx-auto max-w-[1440px]"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">CLIENT CRM</p><div className="mt-3 flex flex-col gap-6 md:flex-row md:items-end md:justify-between"><div><h1 className="text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Khách hàng của tôi.</h1><p className="mt-4 text-lg leading-relaxed text-ink/55">Mở lại hồ sơ và tiếp tục các phiên phân tích đang thực hiện.</p></div><${Link} to="/analysis/new" className="w-fit rounded-full bg-brick px-6 py-4 text-sm font-bold text-white transition hover:bg-plum">+ Tạo hồ sơ mới</${Link}></div><div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-4">${CLIENTS.map((c,index)=>html`<article key=${c.id} className="rounded-2xl border border-plum/10 bg-white p-6 shadow-lg transition hover:-translate-y-1"><div className="flex items-start justify-between"><span className="grid h-12 w-12 place-items-center rounded-xl bg-plum text-sm font-bold text-white">${c.initials}</span><span className=${`rounded-full px-3 py-2 text-xs font-bold tracking-normal ${c.tone}`}>${c.status}</span></div><p className="mt-8 text-xs font-extrabold tracking-wide text-ink/35">KHÁCH HÀNG ${String(index+1).padStart(2,'0')}</p><h2 className="mt-2 text-xl font-bold leading-tight tracking-tight text-plum">${c.name}</h2><div className="my-6 grid grid-cols-2 border-y border-plum/10 py-4"><div><small className="text-xs font-bold tracking-wide text-ink/35">NGÂN SÁCH</small><strong className="mt-2 block text-base tracking-normal text-ink">${c.budget}</strong></div><div className="border-l border-plum/10 pl-4"><small className="text-xs font-bold tracking-wide text-ink/35">KHU VỰC</small><strong className="mt-2 block text-base tracking-normal text-ink">${c.area}</strong></div></div><${Link} to=${`/analysis/${c.id}`} className="flex items-center justify-between rounded-xl bg-[#F4F0EF] px-4 py-3.5 text-sm font-bold tracking-normal text-plum transition hover:bg-plum hover:text-white">Xem phân tích <${Arrow} /></${Link}></article>`)}</div></div></main>`; }
      function ProjectsPage() { return html`<main className="min-h-screen bg-[#F7F3F2] px-5 py-14 lg:px-10 lg:py-20"><div className="mx-auto max-w-[1440px]"><p className="text-xs font-extrabold uppercase tracking-wide text-brick">PROJECT VAULT</p><h1 className="mt-3 text-4xl font-extrabold leading-tight tracking-tight text-plum lg:text-6xl">Kho dự án.</h1><p className="mt-4 max-w-2xl text-lg leading-relaxed text-ink/55">Kho dữ liệu chuẩn hóa để môi giới có thể tư vấn bằng cùng một ngôn ngữ tài chính.</p><div className="mt-12 grid gap-5 md:grid-cols-2 xl:grid-cols-3">${PROJECTS.map((p,i)=>html`<article key=${p.id} className="overflow-hidden rounded-2xl border border-plum/10 bg-white shadow-lg"><div className=${`noise flex h-40 items-end justify-between p-6 text-white ${i%3===0?'bg-plum':i%3===1?'bg-brick':'bg-[#85505A]'}`}><span className="text-xs font-bold tracking-wide text-white/65">PROJECT / ${String(i+1).padStart(2,'0')}</span><strong className="text-4xl font-extrabold tracking-tight">${p.fit}</strong></div><div className="p-6"><p className="text-sm font-bold tracking-normal text-brick">${p.area}</p><h2 className="mt-2 text-2xl font-bold leading-tight tracking-tight text-plum">${p.name}</h2><p className="mt-2 text-base leading-relaxed text-ink/50">${p.rooms} · ${p.distance} km</p><div className="mt-5 flex flex-wrap gap-2">${p.amenities.map(a=>html`<span className="rounded-full bg-[#F3EFEF] px-3 py-2 text-xs font-semibold tracking-normal text-plum">${a}</span>`)}</div><div className="mt-6 flex items-center justify-between border-t border-plum/10 pt-5"><span className="text-sm text-ink/45">Giá tham chiếu</span><b className="text-xl text-plum">${String(p.price).replace('.',',')} tỷ</b></div></div></article>`)}</div></div></main>`; }

      function App() { const [role,setRole]=useState(()=>localStorage.getItem('minfit-role')||null); const logout=()=>{localStorage.removeItem('minfit-role');setRole(null);}; const loggedBroker=role==='broker'; const loggedAdmin=role==='admin'; return html`<div className="min-h-screen"><${Navbar} role=${role} onLogout=${logout} /><${Routes}><${Route} path="/" element=${html`<${HomePage} />`} /><${Route} path="/auth/login" element=${html`<${AuthPage} onLogin=${setRole} />`} /><${Route} path="/auth/register" element=${html`<${AuthPage} mode="register" onLogin=${setRole} />`} /><${Route} path="/admin" element=${loggedAdmin?html`<${AdminPage} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/dashboard" element=${loggedBroker?html`<${BrokerDashboard} clientId="dashboard" />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/clients" element=${loggedBroker?html`<${ClientsPage} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="/projects" element=${html`<${ProjectsPage} />`} /><${Route} path="/analysis/:clientId" element=${loggedBroker?html`<${BrokerDashboard} />`:html`<${Navigate} to="/auth/login" replace />`} /><${Route} path="*" element=${html`<${Navigate} to="/" replace />`} /></${Routes}><${Footer} /></div>`; }
      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
    </script>
  </body>
</html>
