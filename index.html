            '<h3>⚠️ Unhandled Promise Rejection:</h3><p>' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</p></div>';
        }
      });

        const RouterContext = React.createContext({ pathname: window.location.pathname, navigate: (to) => { window.location.pathname = to; } });
        const RouterProvider = RouterContext.Provider;

        function BrowserRouter({ children }) {
          const [pathname, setPathname] = useState(window.location.pathname);
          
          useEffect(() => {
            const handlePopState = () => setPathname(window.location.pathname);
            window.addEventListener('popstate', handlePopState);
            return () => window.removeEventListener('popstate', handlePopState);
          }, []);

          const navigate = useCallback((to, options = {}) => {
            if (options && options.replace) {
              window.history.replaceState({}, '', to);
            } else {
              window.history.pushState({}, '', to);
            }
            setPathname(to.split('?')[0]);
            window.scrollTo(0, 0);
          }, []);

          return html`<${RouterProvider} value=${{ pathname, navigate }}>${children}</${RouterProvider}>`;
        }

        function useLocation() {
          return React.useContext(RouterContext);
        }

        function useNavigate() {
          const { navigate } = React.useContext(RouterContext);
          return navigate;
        }

        function Link({ to, className, children, onClick, ...props }) {
          const navigate = useNavigate();
          return html`<a
            href=${to || '#'}
            className=${className}
            onClick=${(e) => {
              if (to && !to.startsWith('#') && !to.startsWith('http') && !to.startsWith('mailto')) {
                e.preventDefault();
                navigate(to);
              }
              if (onClick) onClick(e);
            }}
            ...${props}
          >${children}</a>`;
        }

        function NavLink({ to, className, children, ...props }) {
          const { pathname } = useLocation();
          const isActive = pathname === to || (to !== '/' && pathname.startsWith(to));
          const finalClass = typeof className === 'function' ? className({ isActive }) : className;
          return html`<${Link} to=${to} className=${finalClass} ...${props}>${children}</${Link}>`;
        }

        function Routes({ children }) {
          const { pathname } = useLocation();
          const currentPath = pathname.length > 1 && pathname.endsWith('/') ? pathname.slice(0, -1) : pathname;
          let matched = null;
          let fallback = null;
          
          const flatChildren = React.Children.toArray(children).flat();
          flatChildren.forEach((child) => {
            if (child && child.props) {
              const { path, element } = child.props;
              if (path === currentPath && !matched) {
                matched = element;
              } else if (path === '*' && !fallback) {
                fallback = element;
              }
            }
          });
          return matched || fallback;
        }

        function Route({ path, element }) {
          return element;

          }, [navigate, to, replace]);

            setScrolled(window.scrollY > 72);
            const pricingEl = document.getElementById('pricing');
            const featuresEl = document.getElementById('features');
            if (pricingEl) {
              const pRect = pricingEl.getBoundingClientRect();
              if (pRect.top <= 300) {

        // Smart living cost auto-calculator

        const handleSyncMarket = () => {

        const update = (key) => (e) => {
          setForm(old => ({

          const defaultDist = dists[0];

        const updateWorkplaceCity = (e) => {

          const defaultDist = dists[0];
          const defaultWard = (WARDS_BY_DISTRICT[defaultDist] || ['Phường 1'])[0];
          const coords = DISTRICT_COORDINATES[defaultDist] || [21.0362, 105.7906];
          setForm(old => ({

        };

        const updateWorkplaceDistrict = (e) => {
          const dist = e.target.value;
          const defaultWard = (WARDS_BY_DISTRICT[dist] || ['Phường 1'])[0];
          const coords = DISTRICT_COORDINATES[dist] || [21.0362, 105.7906];
          setForm(old => ({
            ...old,
            workplace_district: dist,
            workplace_ward: defaultWard,
            workplace_lat: coords[0],
            workplace_lng: coords[1]
          }));
        };

        // GPS Geolocation: Lấy vị trí thực tế từ thiết bị
        const detectGPSLocation = () => {
          if (!navigator.geolocation) {
            setGpsStatus('error');
            setGpsMessage('Trình duyệt không hỗ trợ GPS');
            return;
          }
          setGpsStatus('loading');
          setGpsMessage('Đang lấy vị trí GPS...');
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const userLat = position.coords.latitude;
              const userLng = position.coords.longitude;
              const accuracy = Math.round(position.coords.accuracy);

              // Tìm quận/huyện gần nhất bằng khoảng cách Haversine
              let nearestDist = null;
              let nearestCity = null;
              let minDist = Infinity;

              const toRad = (deg) => deg * Math.PI / 180;
              const haversine = (lat1, lon1, lat2, lon2) => {
                const R = 6371;
                const dLat = toRad(lat2 - lat1);
                const dLon = toRad(lon2 - lon1);
                const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
              };

              for (const [distName, coords] of Object.entries(DISTRICT_COORDINATES)) {
                const d = haversine(userLat, userLng, coords[0], coords[1]);
                if (d < minDist) {
                  minDist = d;
                  nearestDist = distName;
                }
              }

              // Xác định thành phố từ quận
              for (const [city, districts] of Object.entries(DISTRICTS_BY_PROVINCE)) {
                if (districts.includes(nearestDist)) {
                  nearestCity = city;
                  break;
                }
              }

              if (nearestDist && nearestCity) {
                const defaultWard = (WARDS_BY_DISTRICT[nearestDist] || ['Phường 1'])[0];
                setForm(old => ({
                  ...old,
                  workplace_city: nearestCity,
                  workplace_district: nearestDist,
                  workplace_ward: defaultWard,
                  workplace_lat: userLat,
                  workplace_lng: userLng
                }));
                setGpsStatus('success');
                setGpsMessage('📍 ' + nearestDist + ', ' + nearestCity + ' (±' + accuracy + 'm)');
              } else {
                // Nếu không khớp quận nào, vẫn lưu tọa độ GPS thực tế
                setForm(old => ({
                  ...old,
                  workplace_lat: userLat,
                  workplace_lng: userLng
                }));
                setGpsStatus('success');
                setGpsMessage('📍 Tọa độ: ' + userLat.toFixed(4) + ', ' + userLng.toFixed(4) + ' (±' + accuracy + 'm)');
              }

              setTimeout(() => { setGpsStatus('idle'); setGpsMessage(''); }, 8000);
            },
            (err) => {
              setGpsStatus('error');
              if (err.code === 1) setGpsMessage('Bạn chưa cho phép truy cập vị trí');
              else if (err.code === 2) setGpsMessage('Không thể xác định vị trí');
              else setGpsMessage('Hết thời gian chờ GPS');
              setTimeout(() => { setGpsStatus('idle'); setGpsMessage(''); }, 5000);
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
          );
        };

        // Normalize Vietnamese: bỏ dấu để tìm kiếm thông minh
        const normalizeVN = (str) => {
          return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        };

        // Highlight matched text in search results
        const highlightMatch = (text, query) => {
          if (!query || !query.trim()) return text;
          const q = query.trim();
          const idx = text.toLowerCase().indexOf(q.toLowerCase());
          if (idx === -1) {
            // Try normalized match
            const nText = normalizeVN(text);
            const nQ = normalizeVN(q);
            const nIdx = nText.indexOf(nQ);
            if (nIdx === -1) return text;
            const before = text.slice(0, nIdx);
            const match = text.slice(nIdx, nIdx + q.length);
            const after = text.slice(nIdx + q.length);
            return html`<span>${before}<mark className="bg-amber-200/70 text-plum font-black rounded px-0.5">${match}</mark>${after}</span>`;
          }
          const before = text.slice(0, idx);
          const match = text.slice(idx, idx + q.length);
          const after = text.slice(idx + q.length);
          return html`<span>${before}<mark className="bg-amber-200/70 text-plum font-black rounded px-0.5">${match}</mark>${after}</span>`;
        };

        const displayedProjects = useMemo(() => {
          let filtered = projects.filter(p => {

            if (step3Filter === 'district' && p.area !== form.workplace_district) return false;
            if (step3District !== 'all' && p.area !== step3District) return false;
            if (step3Search.trim()) {
              const rawQ = step3Search.trim().toLowerCase();
              const normQ = normalizeVN(step3Search.trim());
              // Chỉ tìm kiếm các trường chính (Tên, CĐT, Vị trí) để tránh loãng kết quả
              const fields = [
                p.name,
                p.developer || '',
                p.area,
              ];
              // Thêm các trường phụ nếu từ khóa đủ dài (VD: "cao cấp", "đang bàn giao")
              if (rawQ.length >= 3) {
                 fields.push(p.segment_label || '', p.handover_status || '');
              }

              const matchAny = fields.some(f => {
                const fLow = f.toLowerCase();
                const fNorm = normalizeVN(f);
                return fLow.includes(rawQ) || fNorm.includes(normQ);
              });
              if (!matchAny) return false;
            }
            return true;
          });

          // Sắp xếp thật thông minh theo độ phù hợp (relevance)
          if (step3Search.trim()) {
            const normQ = normalizeVN(step3Search.trim());
            filtered.sort((a, b) => {
              const getScore = (p) => {
                let score = 0;
                const pName = normalizeVN(p.name);
                const pDev = normalizeVN(p.developer || '');
                const pArea = normalizeVN(p.area || '');

                if (pName === normQ) score += 100;
                else if (pName.startsWith(normQ)) score += 50;
                else if (pName.includes(' ' + normQ)) score += 40; // Khớp đầu một từ
                else if (pName.includes(normQ)) score += 30; // Khớp giữa từ

                if (pDev.startsWith(normQ)) score += 25;
                else if (pDev.includes(normQ)) score += 20;

                if (pArea.includes(normQ)) score += 10;
                
                // Ưu tiên dự án đang bán trong kho nếu điểm tương đương
                if (p.is_selected_by_broker) score += 5;
                return score;
              };

              return getScore(b) - getScore(a);
            });
          }

          return filtered;

        `;

        const handleParseText = () => {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw_text: pasteText })

                showToast('⚠️ Cần bổ sung thêm thông tin bắt buộc.');

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

            .then(data => {

      }

      function ClientsPage() {
        const navigate = useNavigate();
        const [clients, setClients] = useState([]);
        const [loading, setLoading] = useState(true);
        const [search, setSearch] = useState('');
        const [toastMsg, setToastMsg] = useState('');

        const showToast = (msg) => {
          setToastMsg(msg);
          setTimeout(() => setToastMsg(''), 4000);
        };

        const loadClients = () => {
          setLoading(true);
          let currentUser = null;
          try {
            currentUser = JSON.parse(localStorage.getItem('minfit_current_user') || '{}');
          } catch(e) {}
          const brokerId = currentUser?.id || localStorage.getItem('minfit_user_id') || 'broker_default';
          
          fetch(`/api/clients?broker_id=${brokerId}`)
            .then(res => res.json())
            .then(data => setClients(data.clients || []))
            .catch(() => showToast('Lỗi tải danh sách khách hàng.'))
            .finally(() => setLoading(false));
        };

        useEffect(() => {
          loadClients();
        }, []);

        const handleOpenClient = (client) => {
          localStorage.setItem('minfit_loaded_client', JSON.stringify(client));
          navigate('/dashboard');
        };

        const handleDeleteClient = (client) => {
          if (!confirm(`Bạn có chắc muốn xóa hồ sơ khách hàng "${client.name}"?`)) return;
          fetch('/api/clients/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id: client.id })
          })
            .then(res => res.json())
            .then(() => {
              showToast(`Đã xóa hồ sơ ${client.name}`);
              loadClients();
            })
            .catch(() => showToast('Lỗi khi xóa hồ sơ.'));
        };

        const filteredClients = clients.filter(c => {
          if (!search.trim()) return true;
          const q = search.toLowerCase();
          return (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q);
        });

        return html`<main className="screen-only min-h-screen bg-shell px-5 py-10 lg:px-10 lg:py-14">
          <div className="mx-auto max-w-[1440px]">
            <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between border-b border-plum/10 pb-8">
              <div>
                <span className="text-xs font-black uppercase tracking-widest text-brick">
                  QUẢN LÝ HỒ SƠ KHÁCH HÀNG
                </span>
                <h1 className="mt-2 text-3xl lg:text-5xl font-black tracking-tight text-plum">
                  Khách Hàng Của Tôi.
                </h1>
                <p className="mt-2 text-sm sm:text-base text-ink/70 max-w-xl font-medium">
                  Theo dõi danh sách khách hàng, các phương án thẩm định đã lưu và mở xem ngay kết quả phân tích.
                </p>
              </div>

              <div className="flex items-center gap-3">
                <div className="relative w-72">
                  <${Search} size=${15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-ink/40" />
                  <input
                    type="text"
                    placeholder="Tìm tên, số điện thoại..."
                    value=${search}
                    onChange=${e => setSearch(e.target.value)}
                    className="w-full rounded-2xl border border-plum/15 bg-white pl-10 pr-3.5 py-3 text-xs sm:text-sm font-semibold text-plum outline-none shadow-sm transition focus:border-brick"
                  />
                </div>
                <${Link} to="/dashboard" className="rounded-2xl bg-plum px-6 py-3 text-xs sm:text-sm font-black text-white hover:bg-brick transition shadow-md flex items-center gap-2 cursor-pointer">
                  <${Plus} size=${15} />
                  <span>+ Thẩm định hồ sơ mới</span>
                </${Link}>
              </div>
            </div>

            ${loading ? html`
              <div className="py-24 text-center text-base font-bold text-ink/50">Đang tải dữ liệu khách hàng...</div>
            ` : filteredClients.length === 0 ? html`
              <div className="mt-12 rounded-3xl border border-dashed border-plum/20 bg-white p-12 text-center max-w-2xl mx-auto shadow-sm">
                <div className="grid h-16 w-16 place-items-center rounded-2xl bg-plum/5 text-plum mx-auto mb-4">
                  <${User} size=${28} />
                </div>
                <h3 className="text-xl sm:text-2xl font-black text-plum">Chưa có hồ sơ khách hàng nào</h3>
                <p className="mt-2 text-xs sm:text-sm text-ink/60 leading-relaxed max-w-md mx-auto font-medium">
                  Các hồ sơ bạn thẩm định và bấm "Lưu hồ sơ khách hàng" sẽ tự động xuất hiện tại đây để bạn tiện theo dõi và chốt deal.
                </p>
                <${Link} to="/dashboard" className="mt-6 inline-flex rounded-full bg-brick px-7 py-3.5 text-xs sm:text-sm font-bold text-white hover:bg-plum transition shadow-md cursor-pointer">
                  Bắt đầu thẩm định ngay
                </${Link}>
              </div>
            ` : html`
              <div className="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
                ${filteredClients.map((c, index) => {
                  const prof = c.profile || {};
                  const summary = prof.analyzed_summary || {};
                  const initials = (c.name || 'KH').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                  return html`
                    <article key=${c.id} className="rounded-3xl border border-plum/10 bg-white p-6 sm:p-7 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between">
                          <div className="flex items-center gap-3.5">
                            <span className="grid h-12 w-12 place-items-center rounded-2xl bg-plum text-sm font-black text-white shadow-sm">
                              ${initials}
                            </span>
                            <div>
                              <h2 className="text-base sm:text-lg font-black text-plum">${c.name}</h2>
                              <span className="text-xs text-ink/60 font-semibold block">${c.phone || 'Chưa có SĐT'}</span>
                            </div>
                          </div>
                          <span className=${`text-xs font-black px-3 py-1 rounded-full border ${
                            summary.top_class === 'A' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
                            summary.top_class === 'B' ? 'bg-amber-50 text-amber-800 border-amber-300' :
                            'bg-[#FAF7F6] text-ink/60 border-plum/10'
                          }`}>
                            ${summary.top_class ? `Hạng ${summary.top_class}` : 'Đã lưu'}
                          </span>
                        </div>

                        <div className="my-5 grid grid-cols-2 gap-4 border-y border-plum/10 py-4 text-xs sm:text-sm">
                          <div>
                            <span className="text-xs font-bold uppercase text-ink/45 block tracking-wider">THU NHẬP</span>
                            <strong className="text-plum font-black block mt-1 text-sm sm:text-base">${prof.monthly_income ? formatTr(prof.monthly_income) + '/tháng' : '—'}</strong>
                          </div>
                          <div>
                            <span className="text-xs font-bold uppercase text-ink/45 block tracking-wider">VỐN TỰ CÓ</span>
                            <strong className="text-plum font-black block mt-1 text-sm sm:text-base">${prof.available_cash ? formatBillion(prof.available_cash) : '—'}</strong>
                          </div>
                        </div>

                        <div className="space-y-2 text-xs sm:text-sm text-ink/75 font-medium">
                          <div className="flex items-center justify-between">
                            <span className="text-ink/50">Vị trí làm việc:</span>
                            <b className="text-plum font-bold">${prof.workplace_district || '—'}, ${prof.workplace_city || 'HN'}</b>
                          </div>
                          <div className="flex items-center justify-between">
                            <span className="text-ink/50">Dự án quan tâm:</span>
                            <b className="text-brick font-bold">${summary.top_project || `${(prof.selected_projects || []).length} dự án`}</b>
                          </div>
                          <div className="flex items-center justify-between text-xs text-ink/40 pt-1 border-t border-dashed border-plum/10">
                            <span>Ngày lưu:</span>
                            <span>${(c.created_at || '').substring(0, 10) || 'Hôm nay'}</span>
                          </div>
                        </div>
                      </div>

                      <div className="mt-6 pt-4 border-t border-plum/10 flex items-center justify-between gap-2.5">
                        <button
                          type="button"
                          onClick=${() => handleOpenClient(c)}
                          className="flex-1 rounded-xl bg-plum hover:bg-brick py-2.5 px-4 text-center text-xs sm:text-sm font-bold text-white transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer"
                        >
                          <span>Xem kết quả thẩm định (Bước 4)</span>
                          <${ArrowUpRight} size=${14} />
                        </button>
                        <button
                          type="button"
                          onClick=${() => handleDeleteClient(c)}
                          className="rounded-xl p-2.5 text-ink/40 hover:text-brick hover:bg-red-50 transition cursor-pointer"
                          title="Xóa hồ sơ này"
                        >
                          <${Trash2} size=${16} />
                        </button>
                      </div>
                    </article>
                  `;
                })}
              </div>
            `}
            
            ${toastMsg && html`
              <div className="fixed bottom-6 right-6 z-[90] rounded-2xl bg-plum px-6 py-4 text-sm font-bold text-white shadow-2xl flex items-center gap-3">
                <span>${toastMsg}</span>
              </div>
            `}
          </div>
        </main>`;
      }

      function ConsentBanner() {
        const [accepted, setAccepted] = useState(() => {
          return localStorage.getItem('minfit_consent_accepted') === 'true';
        });

        if (accepted) return null;

        const handleAccept = () => {
          localStorage.setItem('minfit_consent_accepted', 'true');
          setAccepted(true);
        };

        return html`
          <aside aria-label="Cam kết bảo mật & Miễn trừ trách nhiệm tài chính" className="fixed bottom-4 left-4 right-4 z-50 mx-auto max-w-4xl rounded-2xl bg-white/95 backdrop-blur-md p-5 shadow-2xl border border-plum/20 text-ink">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div className="space-y-1 text-xs">
                <div className="flex items-center gap-2">
                  <span className="inline-flex items-center rounded-md bg-green-50 px-2 py-0.5 text-[11px] font-bold text-green-700 ring-1 ring-inset ring-green-600/20">
                    Nghị định 13/2023/NĐ-CP & Miễn trừ độc lập
                  </span>
                  <strong className="text-plum font-bold">Điều khoản & Bảo mật Dữ liệu Khách hàng</strong>
                </div>
                <p className="text-ink/70 leading-relaxed">
                  MinFit cam kết bảo mật mọi dữ liệu tài chính thu nhập theo chuẩn mã hóa cục bộ. Các chỉ số (THB Ratio, Real FCF, Payment Shock) mang tính chất tham vấn đo lường vừa vặn độc lập, không thay thế văn bản thẩm định hạn mức tín dụng chính thức của Ngân hàng hoặc hợp đồng CĐT.
                </p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onClick=${handleAccept}
                  className="rounded-xl bg-plum hover:bg-brick px-4 py-2.5 text-xs font-bold text-white transition shadow-md cursor-pointer"
                >
                  Tôi đã hiểu & Đồng ý
                </button>
              </div>
            </div>
          </aside>
        `;
      }

      function ProtectedRoute({ role, children }) {
        if (!role) {
          return html`<${Navigate} to="/login" replace />`;
        }
        return children;
      }

      function App() {
        const [role, setRole] = useState(() => {
          return localStorage.getItem('minfit_role') || null;
        });

        const handleLogin = (selectedRole) => {
          setRole(selectedRole);
          localStorage.setItem('minfit_role', selectedRole);
        };

        const handleLogout = () => {
          setRole(null);
          localStorage.removeItem('minfit_role');
          window.location.href = '/';
        };

        const handleSwitchRole = (newRole) => {
          setRole(newRole);
          localStorage.setItem('minfit_role', newRole);
        };

        return html`<div className="min-h-screen">
          <${Navbar} role=${role} onLogout=${handleLogout} onSwitchRole=${handleSwitchRole} />
          <${Routes}>
            <${Route} path="/" element=${html`<${HomePage} role=${role} />`} />
            <${Route} path="/login" element=${html`<${LoginPage} onLogin=${handleLogin} />`} />
            <${Route} path="/dashboard" element=${html`<${ProtectedRoute} role=${role}><${WorkflowDashboard} /></${ProtectedRoute}>`} />
            <${Route} path="/workflow" element=${html`<${ProtectedRoute} role=${role}><${WorkflowDashboard} /></${ProtectedRoute}>`} />
            <${Route} path="/inventory" element=${html`<${ProtectedRoute} role=${role}><${InventoryPage} /></${ProtectedRoute}>`} />
            <${Route} path="/clients" element=${html`<${ProtectedRoute} role=${role}><${ClientsPage} /></${ProtectedRoute}>`} />
            <${Route}
              path="/admin"
              element=${role === 'admin'
                ? html`<${AdminProjectsPage} onSwitchToBroker=${() => handleSwitchRole('broker')} />`
                : html`<${Navigate} to="/login" replace />`
              }
            />
            <${Route}
              path="/admin/projects"
              element=${role === 'admin'
                ? html`<${AdminProjectsPage} onSwitchToBroker=${() => handleSwitchRole('broker')} />`
                : html`<${Navigate} to="/login" replace />`
              }
            />
            <${Route} path="*" element=${html`<${Navigate} to="/" replace />`} />
          </${Routes}>
          <${Footer} />
          <${ConsentBanner} />
        </div>`;
      }

      createRoot(document.getElementById('root')).render(html`<${BrowserRouter}><${App} /></${BrowserRouter}>`);
      })();
    </script>
  </body>
</html>
